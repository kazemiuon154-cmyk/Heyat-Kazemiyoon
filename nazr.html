<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  // دکمه بازگشت گوشی: اگر صفحه مستقیم (بدون سابقه مرورگر) باز شده باشد،
  // به‌جای نمایش خطا، کاربر را به صفحه اول هیئت برمی‌گرداند
  (function(){
    var fo = /\/other\.html(?:[?#]|$)/.test(document.referrer || ''); if(fo) return;
    try{
      history.pushState({kazemiyoonBackTrap:true}, '', location.href);
      window.addEventListener('popstate', function(){
        location.replace('kazemiyoon.html');
      });
    }catch(err){}
  })();
</script>

<title>🕯️ نذورات | هیئت کاظمیون خرم‌آباد</title>
<meta name="robots" content="noindex, follow">

<style>
  :root{
    --void:#071710;
    --void-2:#0e2419;
    --crimson:#0e9b62;
    --crimson-rgb:14,155,98;
    --crimson-bright:#22c17f;
    --gold:#ffcb3d;
    --gold-soft:#d1a52a;
    --gold-dim:#8a6e1e;
    --parchment:#f3ead0;
    --parchment-dim:#a99b78;
    --line:rgba(255,203,61,0.22);
    --ember:#ffd166;
    --ember-soft:#ffd16666;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgba(var(--crimson-rgb),0.30), transparent 55%),
      radial-gradient(ellipse 90% 50% at 15% 40%, rgba(var(--crimson-rgb),0.10), transparent 60%),
      radial-gradient(ellipse 90% 50% at 85% 75%, rgba(var(--crimson-rgb),0.12), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    animation:page2FadeIn 0.4s ease;
    transition:opacity 0.28s ease, transform 0.28s ease;
  }
  @keyframes page2FadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  body.page-exit{ opacity:0; transform:translateY(-8px); }

  /* ---------------- ذرات ریز طلایی پس‌زمینه ---------------- */
  .embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ember-spark{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 6px 1px var(--ember-soft);
    opacity:0;
    animation-name:rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.9; }
    80%{ opacity:0.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember-spark{ display:none; }
  }
  .page{
    width:100%;
    max-width:500px;
    padding:0 22px 60px;
    position:relative;
    z-index:1;
  }

  /* ============================================================
     THEME SYSTEM (پیش‌فرض: طلایی‌وزمردی / سرخ‌وطلایی /
     صورتی‌وفیروزه‌ای / صورتی‌ویاسی / فیروزه‌ای‌وغروبی /
     کهربایی‌وکرمی / آبی‌آسمانی / سبز فسفری / تاریک)
     همان تعریف رنگ‌های kazemiyoon.html تا در دو صفحه هماهنگ بماند
  ============================================================ */
  body.theme-dark{
    --void:#000000; --void-2:#0a0a0a;
    --crimson:#6e1013; --crimson-bright:#9c2320;
    --gold:#a3853a; --gold-soft:#6f5d33; --gold-dim:#453a22;
    --parchment:#d8d0bf; --parchment-dim:#83786a;
    --line:rgba(163,133,58,0.14);
    background:#000000;
  }
  body.theme-light{
    --void:#04120a; --void-2:#071c11;
    --crimson:#39ff14; --crimson-rgb:57,255,20; --crimson-bright:#7dffb0;
    --gold:#b6ff2e; --gold-soft:#7fd11a; --gold-dim:#4a7a1e;
    --parchment:#e9ffee; --parchment-dim:#8fc79f;
    --line:rgba(57,255,20,0.28);
  }
  body.theme-fest{
    --void:#0c1220; --void-2:#121a2e;
    --crimson:#d81b60; --crimson-rgb:216,27,96; --crimson-bright:#ff4081;
    --gold:#ffca28; --gold-soft:#e0a72a; --gold-dim:#b8860b;
    --parchment:#fff6e0; --parchment-dim:#d8c9a3;
    --line:rgba(255,202,40,0.25);
  }
  body.theme-crimson{
    --void:#0e0906; --void-2:#150e0a;
    --crimson:#8c1518; --crimson-rgb:140,21,24; --crimson-bright:#b8241f;
    --gold:#c9a227; --gold-soft:#8a7040; --gold-dim:#5c4a28;
    --parchment:#f1e7d8; --parchment-dim:#a99c8a;
    --line:rgba(201,162,39,0.16);
  }
  body.theme-lilac{
    --void:#160a1e; --void-2:#1f1029;
    --crimson:#c65bd6; --crimson-rgb:198,91,214; --crimson-bright:#e28ae8;
    --gold:#f0c94e; --gold-soft:#caa53a; --gold-dim:#8a6f28;
    --parchment:#fbeefc; --parchment-dim:#c3a8c9;
    --line:rgba(240,201,78,0.22);
  }
  body.theme-sunset{
    --void:#071c22; --void-2:#0d2a32;
    --crimson:#ff7a45; --crimson-rgb:255,122,69; --crimson-bright:#ff9d6e;
    --gold:#ffcf6b; --gold-soft:#dba63e; --gold-dim:#8f6c22;
    --parchment:#fff3e6; --parchment-dim:#c8b39c;
    --line:rgba(32,196,196,0.25);
  }
  body.theme-amber{
    --void:#1c130a; --void-2:#241a0e;
    --crimson:#c8752b; --crimson-rgb:200,117,43; --crimson-bright:#e29344;
    --gold:#f0c14b; --gold-soft:#cb9f33; --gold-dim:#836a20;
    --parchment:#fbf1dc; --parchment-dim:#c9b998;
    --line:rgba(240,193,75,0.22);
  }
  body.theme-sky{
    --void:#081521; --void-2:#0e2032;
    --crimson:#2f8ce0; --crimson-rgb:47,140,224; --crimson-bright:#5fadf5;
    --gold:#ffd35c; --gold-soft:#d9ac3c; --gold-dim:#8f7126;
    --parchment:#f0f8ff; --parchment-dim:#a9c2d6;
    --line:rgba(127,212,255,0.22);
  }

  /* ---------------- منوی سریع (همبرگری: تم) ---------------- */
  .quick-menu{
    position:fixed;
    top:14px; left:14px;
    z-index:65;
  }
  .quick-menu-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.75);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .quick-menu-btn svg{ width:17px; height:17px; }
  .quick-menu-btn:hover, .quick-menu-btn.active{ border-color:var(--gold-soft); color:var(--gold); }
  .quick-menu-panel{
    position:absolute;
    top:44px; left:0;
    display:flex; flex-direction:column;
    align-items:stretch;
    gap:8px;
    min-width:168px;
    padding:12px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index:65;
  }
  .quick-menu-panel.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .quick-menu-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .quick-menu-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
  }
  .theme-switch-wrap{ position:relative; }
  .theme-toggle-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .theme-toggle-btn svg{ width:15px; height:15px; }
  .theme-toggle-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .theme-popover{
    position:fixed;
    width:max-content;
    max-width:min(260px, calc(100vw - 20px));
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:row; flex-wrap:wrap;
    gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-6px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .theme-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .theme-opt{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 9px; border-radius:9px; cursor:pointer; text-align:center;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .theme-opt.active{ color:var(--void); background:var(--gold); }
  .theme-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .lang-switch-wrap{ position:relative; }
  .lang-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .lang-toggle:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .lang-toggle .lang-flag{ font-size:14px; line-height:1; }
  .lang-popover{
    position:fixed;
    transform:translateY(-6px);
    min-width:150px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:column; gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .lang-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-opt{
    display:flex; align-items:center; gap:8px;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 10px; border-radius:9px; cursor:pointer; text-align:right;
    transition:all 0.15s ease;
  }
  .lang-opt .lang-flag{ font-size:15px; line-height:1; flex:none; }
  .lang-opt.active{ color:var(--void); background:var(--gold); }
  .lang-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .sound-toggle{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .sound-toggle svg{ width:15px; height:15px; }
  .sound-toggle:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ---------------- header ---------------- */
  .page2-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:20px 0 8px;
  }
  .page2-back{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:linear-gradient(135deg, var(--gold-bright, var(--gold)), var(--crimson-bright));
    background-size:200% 200%;
    color:#1a0f04;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.02em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12);
    transition:all 0.2s ease, transform 0.25s ease;
    animation:page2Pulse 2.6s ease-in-out infinite, page2Shine 5s linear infinite;
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:60;
    overflow:hidden;
  }
  .page2-back::after{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:page2Sweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes page2Sweep{
    0%{ transform:translateX(0) skewX(-20deg); }
    38%{ transform:translateX(543%) skewX(-20deg); }
    100%{ transform:translateX(543%) skewX(-20deg); }
  }
  .page2-back svg{ width:16px; height:16px; flex:none; }
  .page2-back:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 2px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(var(--crimson-rgb),0.55), 0 0 0 5px rgba(var(--crimson-rgb),0.18); }
  .page2-back:active{ transform:scale(0.94); }
  @keyframes page2Pulse{
    0%,100%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12); }
    50%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 26px rgba(var(--crimson-rgb),0.65), 0 0 0 8px rgba(var(--crimson-rgb),0.05); }
  }
  @keyframes page2Shine{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .page2-header-title{
    flex:1;
    min-width:0;
    text-align:center;
    font-size:15px;
    font-weight:700;
    color:var(--parchment);
    overflow-wrap:break-word;
  }

  /* ---------------- logo mini ---------------- */
  .mini-logo-wrap{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .mini-logo{
    width:64px; height:64px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------------- group label ---------------- */
  .group-label{
    font-size:12px;
    color:var(--gold-soft);
    letter-spacing:0.1em;
    margin:26px 4px 14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .group-label.group-label-lg{
    font-size:23px;
    color:var(--gold);
    letter-spacing:0.04em;
    font-weight:800;
  }

  /* ---------------- نذورات card (کارت بانکی) ---------------- */
  .nazr-card{
    position:relative;
    padding:24px 20px 20px;
    border-radius:20px;
    border:1px solid rgba(201,162,39,0.35);
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(135deg, #7a1216 0%, #5c0f14 45%, #2c0a0d 100%);
    box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 14px 30px rgba(0,0,0,0.4);
    text-align:center;
    overflow:hidden;
  }
  .nazr-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(60% 60% at 90% 100%, rgba(201,162,39,0.18), transparent 70%);
    pointer-events:none;
  }
  .nazr-card-title{
    font-size:14px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.02em;
    margin-bottom:16px;
    position:relative;
    line-height:1.6;
  }
  .nazr-chip{
    width:38px; height:28px;
    border-radius:6px;
    background:linear-gradient(135deg, #e8d28a, #b6923a);
    margin:0 auto 16px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,0.4) inset;
  }
  .nazr-chip::before{
    content:'';
    position:absolute;
    top:50%; left:4px; right:4px;
    height:1px;
    background:rgba(0,0,0,0.25);
  }
  .nazr-number-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
    position:relative;
  }
  .nazr-number{
    font-size:19px;
    font-weight:700;
    color:var(--parchment);
    letter-spacing:0.06em;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .copy-btn{
    width:38px; height:38px; min-width:38px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.18s ease;
  }
  .copy-btn svg{ width:16px; height:16px; }
  .copy-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .copy-btn:active{ transform:scale(0.92); }
  .nazr-name{
    font-size:15px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:0.03em;
    position:relative;
  }

  /* ============================================================
     ادعیه (زیارت عاشورا و ...)
  ============================================================ */
  .doa-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .doa-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), var(--void);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 24px rgba(0,0,0,0.28);
    color:var(--parchment);
    font-family:inherit;
    cursor:pointer;
    text-align:right;
    transition:border-color 0.2s ease;
  }
  html[dir="ltr"] .doa-item{ text-align:left; }
  .doa-item:hover{ border-color:var(--gold-soft); }
  .doa-item-icon{
    width:36px; height:36px; min-width:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(var(--crimson-rgb),0.16);
    color:var(--gold);
    position:relative;
  }
  .doa-item-icon::after{
    content:'';
    position:absolute; inset:0;
    border-radius:inherit;
    box-shadow:0 0 13px 3px rgba(255,203,61,0.5);
    opacity:0.2;
    animation:iconGlow 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  .doa-item-icon svg{ width:18px; height:18px; }
  @keyframes iconGlow{
    0%,100%{ opacity:0.2; }
    50%{ opacity:1; }
  }
  .doa-item-name{
    flex:1;
    font-size:14.5px;
    font-weight:700;
  }
  .doa-item-chevron{
    width:18px; height:18px;
    color:var(--gold-soft);
    transition:transform 0.25s ease;
    flex-shrink:0;
  }
  .doa-item.open .doa-item-chevron{ transform:rotate(180deg); }

  .doa-sub-panel{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
    margin-top:0;
  }
  .doa-sub-panel.open{
    grid-template-rows:1fr;
    opacity:1;
    margin-top:2px;
  }
  .doa-sub-panel-inner{
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:2px 4px 4px;
  }
  .doa-sub-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 16px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-align:right;
    transition:all 0.18s ease;
  }
  html[dir="ltr"] .doa-sub-btn{ text-align:left; }
  .doa-sub-btn:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .doa-sub-btn svg{ width:15px; height:15px; color:var(--gold-soft); flex-shrink:0; }
  .doa-sub-btn:hover svg{ color:var(--gold); }

  /* ---------------- مودال متن دعا ---------------- */
  .doa-modal-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(3,1,1,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity 0.25s ease, visibility 0.25s ease;
  }
  .doa-modal-overlay.show{ opacity:1; visibility:visible; }
  .doa-modal-sheet{
    position:relative;
    width:100%; max-width:500px;
    height:86vh;
    display:flex;
    flex-direction:column;
    background:var(--void);
    border:1px solid var(--gold-soft);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.5);
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(0.22,1,0.36,1);
  }
  .doa-modal-overlay.show .doa-modal-sheet{ transform:translateY(0); }
  .doa-modal-handle{
    width:38px; height:4px; border-radius:999px;
    background:var(--line);
    margin:12px auto 4px;
    flex-shrink:0;
  }
  .doa-modal-head{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:10px 50px 14px;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .doa-modal-title{
    font-size:15.5px; font-weight:800; color:var(--parchment);
  }
  .doa-modal-close{
    position:absolute; top:6px; left:16px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  html[dir="ltr"] .doa-modal-close{ left:auto; right:16px; }
  .doa-modal-close svg{ width:14px; height:14px; }
  .doa-modal-close:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ============================================================
     دکمه شناور دانلود فایل‌های صوتی (زیارت عاشورا، مداحی و ...)
  ============================================================ */
  .downloads-fab{
    position:fixed;
    right:14px;
    bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    z-index:56;
    display:flex; align-items:center; gap:6px;
    padding:8px 14px 8px 11px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:linear-gradient(135deg, var(--gold), var(--gold-dim));
    color:var(--void);
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,203,61,0.5);
    animation:downloads-fab-pulse 2.6s ease-in-out infinite;
    transition:transform 0.18s ease, opacity 0.25s ease, visibility 0.25s ease;
    white-space:nowrap;
  }
  .downloads-fab:active{ transform:scale(0.95); }
  .downloads-fab.collapsed{
    opacity:0; visibility:hidden;
    transform:scale(0.8);
    pointer-events:none;
  }
  .downloads-fab svg{ width:14px; height:14px; flex:none; }
  .downloads-fab-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:11px;
    font-weight:800;
    letter-spacing:-0.2px;
  }
  @keyframes downloads-fab-pulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,203,61,0.45); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 9px rgba(255,203,61,0); }
  }

  .downloads-list{
    display:flex; flex-direction:column; gap:10px;
    text-align:right;
  }
  .download-item{
    display:flex; flex-direction:column; gap:8px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--glass);
  }
  .download-item-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .download-progress{
    height:3px; border-radius:2px; overflow:hidden;
    background:rgba(255,255,255,0.1);
    display:none;
  }
  .download-item.loading .download-progress{ display:block; }
  .download-progress-fill{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--gold), var(--crimson-bright));
    transition:width 0.2s ease;
  }
  .download-item-title{ font-size:13px; font-weight:700; color:var(--parchment); }
  .download-item-sub{ font-size:10.5px; color:var(--parchment-dim); margin-top:2px; }
  .download-btn{
    flex:none;
    display:flex; align-items:center; gap:6px;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:rgba(255,203,61,0.08);
    color:var(--gold);
    font-family:'Vazirmatn', sans-serif;
    font-size:11px; font-weight:700;
    cursor:pointer;
    transition:all 0.18s ease;
    white-space:nowrap;
  }
  .download-btn:hover{ background:rgba(255,203,61,0.16); }
  .download-btn .dl-icon{ width:14px; height:14px; }
  .download-btn.loading .dl-icon{ animation:dl-spin 0.9s linear infinite; }
  @keyframes dl-spin{ to{ transform:rotate(360deg); } }
  .download-btn.done{ border-color:var(--crimson-bright); color:var(--crimson-bright); background:rgba(34,193,127,0.12); }
  .download-btn.loading{ border-color:rgba(255,90,90,0.55); color:#ff8a8a; cursor:pointer; }
  .download-btn.loading:hover{ background:rgba(255,90,90,0.14); }
  .download-btn .dl-icon-cancel{ display:none; }
  .download-btn.loading .dl-icon{ display:none; }
  .download-btn.loading .dl-icon-cancel{ display:block; animation:none; }

  .doa-modal-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:22px 22px 40px;
  }
  .doa-text-arabic{
    font-family:'Amiri', serif;
    font-size:21px;
    line-height:2.5;
    text-align:center;
    color:var(--parchment);
    direction:rtl;
  }
  .doa-text-fa{
    font-family:'Vazirmatn', sans-serif;
    font-size:14.5px;
    line-height:2.3;
    text-align:justify;
    color:var(--parchment);
    direction:rtl;
  }
  .doa-text-placeholder{
    text-align:center;
    color:var(--parchment-dim);
    font-size:13px;
    padding:30px 10px;
    line-height:2;
  }
  .doa-text-arabic p{ margin:0 0 18px; }
  .doa-text-arabic p:last-child{ margin-bottom:0; }
  .doa-text-arabic p.doa-text-note{
    font-family:'Vazirmatn', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--gold);
    line-height:1.8;
    margin:6px 0 4px;
  }
  .doa-text-fa p{ margin:0 0 16px; }
  .doa-text-fa p:last-child{ margin-bottom:0; }
  .doa-text-fa p.doa-text-note{
    font-weight:700;
    color:var(--gold);
    text-align:center;
    margin:4px 0;
  }
  .doa-text-fa p.doa-text-source{
    font-size:12px;
    color:var(--parchment-dim);
    text-align:center;
    margin-top:8px;
  }

  /* ---------------- پخش صوت زیارت ---------------- */
  .doa-audio-wrap{
    padding:26px 22px 10px;
    text-align:center;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .doa-audio-status{
    font-size:11.5px;
    color:var(--parchment-dim);
    text-align:center;
    min-height:16px;
    margin-top:4px;
  }
  .doa-audio-hint{
    font-size:12.5px;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:16px;
  }
  .doa-audio-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .doa-audio-btn{
    width:56px; height:56px; min-width:56px;
    border-radius:50%;
    border:1px solid var(--gold-soft);
    background:linear-gradient(180deg, rgba(var(--crimson-rgb),0.35), rgba(var(--crimson-rgb),0.12));
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .doa-audio-btn:hover{ border-color:var(--gold); }
  .doa-audio-btn:active{ transform:scale(0.92); }
  .doa-audio-btn svg{ width:22px; height:22px; }
  .doa-audio-btn .icon-pause{ display:none; }
  .doa-audio-btn.playing .icon-play{ display:none; }
  .doa-audio-btn.playing .icon-pause{ display:flex; }
  .doa-audio-seek-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    max-width:340px;
    margin-left:auto; margin-right:auto;
  }
  .doa-audio-time{
    font-size:11px; color:var(--parchment-dim);
    min-width:34px;
    font-variant-numeric:tabular-nums;
  }
  .doa-audio-seek{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:999px;
    background:linear-gradient(to left, var(--gold) var(--pct,0%), var(--line) var(--pct,0%));
    outline:none;
    transition:box-shadow 0.25s ease;
  }
  .doa-audio-seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.2);
    cursor:pointer;
    transition:box-shadow 0.25s ease, transform 0.15s ease;
  }
  .doa-audio-seek::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%;
    background:var(--gold); border:none;
    box-shadow:0 0 0 3px rgba(201,162,39,0.2);
    cursor:pointer;
    transition:box-shadow 0.25s ease, transform 0.15s ease;
  }
  .doa-audio-wrap.playing .doa-audio-seek::-webkit-slider-thumb{
    box-shadow:0 0 0 3px rgba(201,162,39,0.28), 0 0 10px 2px rgba(201,162,39,0.55);
    transform:scale(1.12);
  }
  .doa-audio-wrap.playing .doa-audio-seek::-moz-range-thumb{
    box-shadow:0 0 0 3px rgba(201,162,39,0.28), 0 0 10px 2px rgba(201,162,39,0.55);
    transform:scale(1.12);
  }

  /* ---------------- افکت پخش صوت (هاله + اکولایزر) ---------------- */
  .doa-audio-btn{ position:relative; }
  .doa-audio-btn::before,
  .doa-audio-btn::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0;
    pointer-events:none;
  }
  .doa-audio-btn.playing::before,
  .doa-audio-btn.playing::after{
    animation:doa-audio-pulse 1.8s ease-out infinite;
  }
  .doa-audio-btn.playing::after{ animation-delay:0.6s; }
  @keyframes doa-audio-pulse{
    0%{ transform:scale(1); opacity:0.55; }
    100%{ transform:scale(1.55); opacity:0; }
  }
  .doa-audio-btn.playing{
    box-shadow:0 0 16px 2px rgba(var(--crimson-rgb),0.45);
  }
  .doa-audio-eq{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:3px;
    height:16px;
    margin-inline-start:2px;
  }
  .doa-audio-wrap.playing .doa-audio-eq{ display:flex; }
  .doa-audio-eq span{
    display:block;
    width:3px;
    height:16px;
    transform-origin:bottom;
    border-radius:2px;
    background:var(--gold);
    animation:doa-audio-eq-bounce 0.9s ease-in-out infinite;
  }
  .doa-audio-eq span:nth-child(1){ animation-delay:0s; }
  .doa-audio-eq span:nth-child(2){ animation-delay:0.2s; }
  .doa-audio-eq span:nth-child(3){ animation-delay:0.4s; }
  .doa-audio-eq span:nth-child(4){ animation-delay:0.15s; }
  @keyframes doa-audio-eq-bounce{
    0%, 100%{ transform:scaleY(0.25); }
    50%{ transform:scaleY(1); }
  }

  /* ---------------- toast ---------------- */
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(20,14,10,0.95);
    color:var(--parchment);
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:200;
    box-shadow:0 10px 24px rgba(0,0,0,0.4);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .guide-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:max-content;
    margin:30px auto 0;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--gold-soft);
    font-family:'Vazirmatn', sans-serif;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    transition:all 0.18s ease;
  }
  .guide-link:hover{ border-color:var(--gold-soft); color:var(--gold); background:rgba(255,255,255,0.06); }
  .guide-link svg{ width:14px; height:14px; flex:none; }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:11.5px;
    color:var(--gold-dim);
  }

/* =====================================================================
   منوی تنظیمات (نسخه‌ی جدید، هم‌شکل منوی صفحه‌ی ورود): قرص «تنظیمات» + صفحه‌ی شیشه‌ای
   زبان، تم، اندازه‌ی متن، صدا، نصب اپ، مرکز دانلود، راهنمای سایت
   ===================================================================== */
.quick-menu[hidden]{ display:none !important; }
.kzm-menu-btn{
  appearance:none; -webkit-appearance:none; font-family:inherit; cursor:pointer;
  position:fixed; top:14px; left:14px; z-index:65;
  display:inline-flex; align-items:center; gap:7px; height:30px; padding-inline:4px 12px; border-radius:999px;
  border:1px solid rgba(255,203,61,0.4); color:var(--parchment,#f4e8d0); font-size:11.5px; font-weight:800; line-height:1; white-space:nowrap;
  background:linear-gradient(135deg, rgba(255,203,61,0.16), rgba(255,203,61,0.03)), var(--void-2, #0a1d14);
  box-shadow:0 6px 14px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  transition:transform .2s ease, border-color .25s ease, box-shadow .25s ease;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover){ .kzm-menu-btn:hover{ border-color:var(--gold); box-shadow:0 6px 16px -6px rgba(0,0,0,0.6), 0 0 14px rgba(255,203,61,0.25), inset 0 1px 0 rgba(255,255,255,0.1); } }
.kzm-menu-btn:active{ transform:scale(.95); }
.kzm-menu-btn:focus-visible, .kzm-menu :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.kzm-menu-ic{ flex:none; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(255,203,61,0.2); box-shadow:inset 0 0 0 1px rgba(255,203,61,0.34); }
.kzm-menu-ic svg{ width:12px; height:12px; fill:none; stroke:var(--gold); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

/* بزرگ‌نمایی محتوای صفحه (خود منو ثابت می‌ماند) */
html:not(.kzm-bodyzoom) .page{ zoom:var(--kzm-zoom, 1); }
html.kzm-bodyzoom .kzm-menu-btn, html.kzm-bodyzoom .kzm-overlay{ zoom:var(--kzm-inv, 1); }

/* پرده‌ی پشت و کارت تنظیمات */
.kzm-overlay{
  position:fixed; inset:0; z-index:400; display:flex; justify-content:center; align-items:flex-start; padding:14px;
  background:rgba(3,10,7,0.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
  font-family:'Vazirmatn', sans-serif; color:var(--parchment,#f4e8d0);
}
.kzm-overlay.open{ opacity:1; visibility:visible; }
.kzm-menu{
  width:min(344px, 100%); max-height:calc(100vh - 28px); overflow-y:auto; padding:16px 16px 16px; border-radius:26px;
  border:1px solid rgba(255,203,61,0.36);
  background:
    radial-gradient(110% 55% at 50% 0%, rgba(255,203,61,0.18), transparent 62%),
    linear-gradient(180deg, var(--void-2, #112d1f), var(--void, #06120c));
  box-shadow:0 26px 60px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.09);
  transform:translateY(-16px) scale(.96); transition:transform .3s cubic-bezier(.2,1.1,.3,1);
}
.kzm-overlay.open .kzm-menu{ transform:none; }
.kzm-menu-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.kzm-menu-title{ display:inline-flex; align-items:center; gap:9px; font-size:16px; font-weight:900; color:var(--gold); }
.kzm-menu-title::before{ content:''; width:8px; height:8px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 10px rgba(255,203,61,0.7); }
.kzm-close{ appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; flex:none; width:32px; height:32px; padding:0; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,203,61,0.1); border:1px solid rgba(255,203,61,0.3); color:var(--gold); transition:background .2s ease; }
.kzm-close:active{ background:rgba(255,203,61,0.24); }
.kzm-close svg{ width:13px; height:13px; }
.kzm-card{ margin-top:10px; padding:12px 12px 13px; border-radius:18px; border:1px solid rgba(255,203,61,0.16); background:rgba(255,255,255,0.035); }
.kzm-card[hidden]{ display:none; }
.kzm-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.kzm-card-title{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:var(--parchment,#f4e8d0); }
.kzm-ic{ flex:none; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; background:rgba(255,203,61,0.13); box-shadow:inset 0 0 0 1px rgba(255,203,61,0.28); }
.kzm-ic svg{ width:14px; height:14px; fill:none; stroke:var(--gold); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.kzm-val{ font-size:12.5px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* زبان: سه کاشی انتخابی */
.kzm-langs{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.kzm-langs button{
  appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px 9px; border-radius:16px;
  border:1px solid rgba(255,203,61,0.2); background:rgba(4,14,9,0.55); color:rgba(244,232,208,0.78);
  transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.kzm-langs button:active{ transform:scale(.96); }
.kzm-langs .g.flag{ display:block; width:34px; height:23px; margin:2px 0 3px; border-radius:5px; overflow:hidden; line-height:0; box-shadow:0 0 0 1px rgba(255,255,255,0.28), 0 2px 6px rgba(0,0,0,0.45); }
.kzm-langs .g.flag img{ display:block; width:100%; height:100%; object-fit:cover; }
.kzm-langs button[aria-checked="true"] .g.flag{ box-shadow:0 0 0 1.5px rgba(255,203,61,0.9), 0 0 10px rgba(255,203,61,0.35); }
.kzm-langs .n{ font-size:10.5px; font-weight:700; line-height:1.4; opacity:.85; }
.kzm-langs button[aria-checked="true"], .kzm-themes button[aria-checked="true"]{
  color:var(--gold); border-color:rgba(255,203,61,0.85);
  background:radial-gradient(90% 90% at 50% 0%, rgba(255,203,61,0.26), rgba(255,203,61,0.06));
  box-shadow:0 0 16px rgba(255,203,61,0.22), inset 0 1px 0 rgba(255,255,255,0.14);
}
.kzm-langs button[aria-checked="true"]::after, .kzm-themes button[aria-checked="true"]::after{ content:''; position:absolute; top:6px; inset-inline-end:6px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,203,61,0.9); }

/* تم: کاشی‌های رنگی */
.kzm-themes{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.kzm-themes button{
  appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 4px 8px; border-radius:14px;
  border:1px solid rgba(255,203,61,0.2); background:rgba(4,14,9,0.45); color:rgba(244,232,208,0.78);
  transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.kzm-themes button:active{ transform:scale(.96); }
.kzm-themes .sw{ display:block; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--a), var(--b)); box-shadow:0 0 0 1px rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.45); }
.kzm-themes .n{ font-size:9.5px; font-weight:700; line-height:1.35; text-align:center; opacity:.9; }

/* اندازه‌ی متن: لغزنده */
.kzm-sizebox{ display:flex; align-items:center; gap:10px; direction:ltr; }
.kzm-sizebox .a{ flex:none; font-weight:900; color:rgba(244,232,208,0.7); line-height:1; }
.kzm-sizebox .a.s{ font-size:12px; } .kzm-sizebox .a.l{ font-size:21px; }
.kzm-range{ -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:24px; margin:0; background:transparent; cursor:pointer; --p:30%; }
.kzm-range::-webkit-slider-runnable-track{ height:6px; border-radius:999px; background:linear-gradient(90deg, #e9aa1c, var(--gold) var(--p), rgba(255,255,255,0.14) var(--p)); }
.kzm-range::-moz-range-track{ height:6px; border-radius:999px; background:rgba(255,255,255,0.14); }
.kzm-range::-moz-range-progress{ height:6px; border-radius:999px; background:linear-gradient(90deg, #e9aa1c, var(--gold)); }
.kzm-range::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 60%, #e9aa1c); border:2px solid #07170f; box-shadow:0 0 0 1px rgba(255,203,61,0.7), 0 3px 10px rgba(0,0,0,0.55); }
.kzm-range::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 60%, #e9aa1c); border:2px solid #07170f; box-shadow:0 0 0 1px rgba(255,203,61,0.7), 0 3px 10px rgba(0,0,0,0.55); }
.kzm-range:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:8px; }

/* صدا / نصب / دانلود / راهنما: کاشی‌های ردیفی */
.kzm-pair{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
.kzm-pair .kzm-card{ margin-top:0; display:flex; align-items:center; gap:9px; padding:11px 12px; text-decoration:none; color:inherit; min-width:0; font:inherit; text-align:start; width:100%; }
.kzm-pair .kzm-card[hidden]{ display:none; }
.kzm-pair .kzm-card .kzm-card-title{ flex:1; min-width:0; }
button.kzm-card{ appearance:none; -webkit-appearance:none; cursor:pointer; color:var(--parchment,#f4e8d0); }
.kzm-switch{ appearance:none; -webkit-appearance:none; cursor:pointer; flex:none; position:relative; width:42px; height:24px; padding:0; border-radius:999px; border:1px solid rgba(255,203,61,0.28); background:rgba(255,255,255,0.1); transition:background .25s ease, border-color .25s ease; }
.kzm-switch i{ position:absolute; top:2px; inset-inline-start:2px; width:18px; height:18px; border-radius:50%; background:#f4e8d0; box-shadow:0 2px 6px rgba(0,0,0,0.5); transition:inset-inline-start .25s cubic-bezier(.3,1.3,.5,1), background .25s ease; }
.kzm-switch[aria-checked="true"]{ background:linear-gradient(135deg, #ffe58f, var(--gold) 60%, #e9aa1c); border-color:rgba(255,226,138,0.8); }
.kzm-switch[aria-checked="true"] i{ inset-inline-start:20px; background:#2a1d00; }
.kzm-guide{ border-color:rgba(255,203,61,0.34) !important; background:linear-gradient(135deg, rgba(255,203,61,0.16), rgba(255,203,61,0.04)) !important; transition:border-color .2s ease, transform .2s ease; }
.kzm-guide:active{ transform:scale(.97); }
@media (hover:hover){ .kzm-guide:hover{ border-color:rgba(255,203,61,0.7) !important; } }
.kzm-chev{ flex:none; width:15px; height:15px; fill:none; stroke:var(--gold); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
html[dir="ltr"] .kzm-chev{ transform:scaleX(-1); }
@media (max-width:359px){ .kzm-menu{ padding:14px 12px; } }
@media (prefers-reduced-motion: reduce){ .kzm-overlay, .kzm-menu, .kzm-switch i{ transition:none; } }

<div class="toast" id="toast"></div>

<script>
  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, successMsg){
    try{
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast(successMsg); }catch(e2){}
      document.body.removeChild(ta);
    }
  }

  (function nazrCopy(){
    const btn = document.getElementById('copy-nazr-number');
    const numEl = document.getElementById('nazr-number');
    if(!btn || !numEl) return;
    btn.addEventListener('click', () => {
      const digitsOnly = numEl.textContent.replace(/[^0-9]/g, '');
      copyText(digitsOnly, 'شماره کارت کپی شد');
    });
  })();

  // ---------------- تغییر و همگام‌سازی تم با صفحه اول ----------------
  (function themeSwitcher(){
    const toggle = document.getElementById('theme-toggle');
    const popover = document.getElementById('theme-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.theme-opt');

    document.body.appendChild(popover);

    const THEME_CLASSES = ['theme-light', 'theme-dark', 'theme-fest', 'theme-crimson', 'theme-lilac', 'theme-sunset', 'theme-amber', 'theme-sky'];
    function applyTheme(theme){
      document.body.classList.remove(...THEME_CLASSES);
      if(THEME_CLASSES.includes('theme-' + theme)) document.body.classList.add('theme-' + theme);
      opts.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      try{ localStorage.setItem('kazemiuon-theme', theme); }catch(e){}
    }

    let saved = 'default';
    try{ saved = localStorage.getItem('kazemiuon-theme') || 'default'; }catch(e){}
    applyTheme(saved);

    function positionThemePopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 132;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const top = rect.top - popover.offsetHeight - 8;
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionThemePopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionThemePopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        applyTheme(b.dataset.theme);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- باز/بسته شدن منوی همبرگری ----------------
  (function quickMenu(){
    const btn = document.getElementById('quick-menu-btn');
    const panel = document.getElementById('quick-menu-panel');
    if(!btn || !panel) return;

    function closePanel(){
      panel.classList.remove('show');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const themePop = document.getElementById('theme-popover');
      const langPop = document.getElementById('lang-popover');
      if(themePop) themePop.classList.remove('show');
      if(langPop) langPop.classList.remove('show');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      btn.classList.toggle('active', show);
      btn.setAttribute('aria-expanded', String(show));
    });

    document.addEventListener('click', (e) => {
      if(!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
        closePanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closePanel();
    });
  })();

  // ---------------- ترجمه‌ها ----------------
  const translations = {
    fa: {
      backBtn: 'بازگشت',
      pageTitle: '🕯️ نذورات',
      nazrGroupLabel: 'نذورات',
      nazrTitle: 'واریز نذورات نقدی به شماره کارت ذیل',
      nazrName: 'مسعود زندیه شیرازی',
      guideLinkText: 'راهنمای سایت',
      footerSub: 'پایگاه اطلاع‌رسانی هیئت کاظمیون خرم‌آباد',
      quickMenuTheme: 'تم',
      quickMenuLang: 'زبان',
      quickMenuSound: 'صدا',
      quickMenuInstall: 'نصب اپ'
    },
    ar: {
      backBtn: 'رجوع',
      pageTitle: '🕯️ النذور',
      nazrGroupLabel: 'النذور',
      nazrTitle: 'إيداع النذور النقدية إلى رقم البطاقة أدناه',
      nazrName: 'مسعود زنديه شيرازي',
      guideLinkText: 'دليل الموقع',
      footerSub: 'القناة الرسمية لموكب الكاظميون خرم‌آباد',
      quickMenuTheme: 'المظهر',
      quickMenuLang: 'اللغة',
      quickMenuSound: 'الصوت',
      quickMenuInstall: 'تثبيت التطبيق'
    },
    en: {
      backBtn: 'Back',
      pageTitle: '🕯️ Votive Offerings',
      nazrGroupLabel: 'Votive Offerings',
      nazrTitle: 'Deposit cash donations to the card number below',
      nazrName: 'Masoud Zandiyeh Shirazi',
      guideLinkText: 'Site Guide',
      footerSub: 'Official channel of Heyat-e Kazemiyoon Khorramabad',
      quickMenuTheme: 'Theme',
      quickMenuLang: 'Language',
      quickMenuSound: 'Sound',
      quickMenuInstall: 'Install App'
    }
  };

  let currentLang = 'fa';

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[lang][key] !== undefined){
        el.textContent = translations[lang][key];
      }
    });
    const activeOpt = document.querySelector('.lang-opt[data-lang="' + lang + '"]');
    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if(activeOpt){
      const flagEl = document.getElementById('lang-toggle-flag');
      const codeEl = document.getElementById('lang-toggle-code');
      if(flagEl) flagEl.textContent = activeOpt.dataset.flag;
      if(codeEl) codeEl.textContent = activeOpt.dataset.code;
    }
  }

  // ---------------- تغییر زبان ----------------
  (function langSwitcher(){
    const toggle = document.getElementById('lang-toggle');
    const popover = document.getElementById('lang-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.lang-opt');

    document.body.appendChild(popover);

    function positionLangPopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 150;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const ph = popover.offsetHeight || 140;
      let top = rect.bottom + 8;
      if(top + ph > window.innerHeight - margin){
        top = rect.top - ph - 8;
      }
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionLangPopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionLangPopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        setLang(b.dataset.lang);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- دکمه صدا (افکت تیک کلیک) ----------------
  (function soundToggle(){
    const soundState = { muted: true, ctx: null };
    function ensureAudioCtx(){
      if(!soundState.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) soundState.ctx = new AC();
      }
      return soundState.ctx;
    }
    function playTick(){
      if(soundState.muted) return;
      const ctx = ensureAudioCtx();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime;
      osc.frequency.setValueAtTime(720, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.16);
    }
    document.querySelectorAll('.lang-opt, .lang-toggle, .theme-opt, .copy-btn').forEach(el => {
      el.addEventListener('click', playTick);
    });
    const btn = document.getElementById('sound-toggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      soundState.muted = !soundState.muted;
      btn.setAttribute('aria-pressed', String(!soundState.muted));
      btn.querySelector('.icon-sound-on').style.display = soundState.muted ? 'none' : 'block';
      btn.querySelector('.icon-sound-off').style.display = soundState.muted ? 'block' : 'none';
      if(!soundState.muted){ ensureAudioCtx(); playTick(); }
    });
  })();

  // ---------------- انتقال نرم به صفحه اول (پیش‌بارگذاری + بدون پرش) ----------------
  (function backSmoothNav(){
    const trigger = document.getElementById('page2-back');
    if(!trigger) return;
    const targetHref = trigger.getAttribute('href');

    function prefetchTarget(){
      if(document.getElementById('page2-prefetch-link')) return;
      const link = document.createElement('link');
      link.id = 'page2-prefetch-link';
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = targetHref;
      document.head.appendChild(link);
    }

    // وقتی کاربر با اسکرول به دکمه بازگشت نزدیک می‌شود، صفحه اول از قبل بارگذاری شود
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            prefetchTarget();
            io.disconnect();
          }
        });
      }, { root:null, rootMargin:'500px 0px', threshold:0 });
      io.observe(trigger);
    } else {
      prefetchTarget();
    }

    trigger.addEventListener('pointerenter', prefetchTarget, { once:true });
    trigger.addEventListener('touchstart', prefetchTarget, { once:true, passive:true });
    trigger.addEventListener('focus', prefetchTarget, { once:true });

    /* لینک بازگشت الان یک لینک عادی است و بی‌درنگ باز می‌شود؛ پیش‌بارگذاری
       بالا هنوز فعال است تا صفحه اول سریع‌تر لود شود، اما دیگر منتظر
       انیمیشن محو شدن نمی‌مانیم که باعث لگ می‌شد. */
  })();

  // ذرات ریز طلایی پس‌زمینه (امبر)
  (function embers(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    var wrap = document.getElementById('embers');
    if(!wrap) return;
    var count = 8;
    for(var i=0;i<count;i++){
      var s = document.createElement('div');
      s.className = 'ember-spark';
      var left = Math.random()*100;
      var delay = Math.random()*10;
      var dur = 6 + Math.random()*6;
      var drift = (Math.random()*60 - 30) + 'px';
      s.style.left = left + 'vw';
      s.style.animationDelay = delay + 's';
      s.style.animationDuration = dur + 's';
      s.style.setProperty('--drift', drift);
      wrap.appendChild(s);
    }
  })();
</script>


<script>
  // ---------------- ثبت Service Worker و نصب PWA ----------------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
  (function pwaInstall(){
    let deferredPrompt = null;
    const row = document.getElementById('pwa-install-row');
    const btn = document.getElementById('pwa-install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if(row) row.style.display = '';
    });
    if(btn){
      btn.addEventListener('click', async () => {
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(row) row.style.display = 'none';
      });
    }
    window.addEventListener('appinstalled', () => {
      if(row) row.style.display = 'none';
    });
  })();
</script>

<script>
/* منوی تنظیمات (جدید): ظاهر تازه؛ تم، زبان، صدا، نصب اپ و مرکز دانلود همچنان با کنترل‌های قدیمیِ مخفیِ همین صفحه کار می‌کنند. */
(function(){
  try{
    var D = {"fa": {"mOpen": "منو و تنظیمات", "mClose": "بستن", "mTitle": "تنظیمات", "mLang": "زبان", "mSize": "اندازه متن", "mSound": "صدا", "mGuide": "راهنمای سایت", "mTheme": "تم", "mInstall": "نصب اپلیکیشن", "mDownloads": "مرکز دانلود"}, "ar": {"mOpen": "القائمة والإعدادات", "mClose": "إغلاق", "mTitle": "الإعدادات", "mLang": "اللغة", "mSize": "حجم النص", "mSound": "الصوت", "mGuide": "دليل الموقع", "mTheme": "المظهر", "mInstall": "تثبيت التطبيق", "mDownloads": "مركز التحميل"}, "en": {"mOpen": "Menu & settings", "mClose": "Close", "mTitle": "Settings", "mLang": "Language", "mSize": "Text size", "mSound": "Sound", "mGuide": "Site guide", "mTheme": "Theme", "mInstall": "Install app", "mDownloads": "Download center"}};
    var TH = {"default": {"fa": "طلایی و زمردی", "ar": "ذهبي وزمردي", "en": "Gold & emerald"}, "crimson": {"fa": "سرخ و طلایی", "ar": "قرمزي وذهبي", "en": "Crimson & gold"}, "fest": {"fa": "صورتی و فیروزه‌ای", "ar": "وردي وفيروزي", "en": "Pink & turquoise"}, "lilac": {"fa": "صورتی و یاسی", "ar": "وردي وأرجواني", "en": "Pink & lilac"}, "sunset": {"fa": "فیروزه‌ای و غروبی", "ar": "فيروزي وغروب", "en": "Turquoise & sunset"}, "amber": {"fa": "کهربایی و کرمی", "ar": "عنبري وكريمي", "en": "Amber & cream"}, "sky": {"fa": "آبی آسمانی", "ar": "أزرق سماوي", "en": "Sky blue"}, "light": {"fa": "سبز فسفری", "ar": "أخضر فسفوري", "en": "Neon green"}, "dark": {"fa": "تاریک", "ar": "داكن", "en": "Dark"}};
    var DIGITS = { fa:['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'], ar:['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'] };
    var LS = {
      get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
      set:function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
    };
    var root = document.documentElement;
    var $ = function(s){ return document.querySelector(s); };
    var $$ = function(s){ return document.querySelectorAll(s); };
    var btn = $('#kzm-menu-btn'), overlay = $('#kzm-overlay'), panel = $('#kzm-menu'), closeBtn = $('#kzm-close');
    if(!btn || !overlay || !panel) return;
    function lang(){ var l = root.lang || 'fa'; return D[l] ? l : 'fa'; }
    function nf(n){ var t = DIGITS[lang()]; var s = String(n); return t ? s.replace(/[0-9]/g, function(c){ return t[+c]; }) : s; }
    function click(sel){ var el = $(sel); if(el){ el.click(); return true; } return false; }

    /* ----- متن‌ها ----- */
    var sizePct = 100;
    function showSize(){ var v = $('#kzm-size-val'); if(v) v.textContent = nf(sizePct) + (lang() === 'en' ? '%' : '٪'); }
    function paint(){
      var l = lang(), d = D[l];
      $$('#kzm-menu-btn [data-k], #kzm-menu [data-k]').forEach(function(el){ var v = d[el.getAttribute('data-k')]; if(v !== undefined) el.textContent = v; });
      $$('#kzm-menu-btn [data-k-aria], #kzm-menu [data-k-aria]').forEach(function(el){ var v = d[el.getAttribute('data-k-aria')]; if(v !== undefined) el.setAttribute('aria-label', v); });
      $$('.kzm-langs button').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-lang') === l)); });
      $$('.kzm-themes button').forEach(function(b){ var t = TH[b.getAttribute('data-theme')]; var n = b.querySelector('.n'); if(t && n) n.textContent = t[l]; });
      showSize();
    }

    /* ----- باز و بسته شدن ----- */
    function syncAll(){ syncTheme(); syncSound(); syncInstall(); }
    function setOpen(on){
      overlay.classList.toggle('open', on);
      btn.setAttribute('aria-expanded', String(on));
      document.body.style.overflow = on ? 'hidden' : '';
      if(on){ syncAll(); var f = panel.querySelector('.kzm-langs button[aria-checked="true"]') || closeBtn; if(f) f.focus({ preventScroll:true }); }
    }
    btn.addEventListener('click', function(){ setOpen(true); });
    closeBtn.addEventListener('click', function(){ setOpen(false); btn.focus({ preventScroll:true }); });
    overlay.addEventListener('click', function(e){ if(e.target === overlay) setOpen(false); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('open')){ setOpen(false); btn.focus({ preventScroll:true }); } });

    /* ----- زبان ----- */
    var userLang = false;
    var hasLang = !!$('#lang-popover .lang-opt');
    if(!hasLang){ var cl = $('#kzm-card-lang'); if(cl) cl.remove(); }
    $$('.kzm-langs button').forEach(function(b){
      b.addEventListener('click', function(){
        var l = b.getAttribute('data-lang'); userLang = true;
        click('#lang-popover .lang-opt[data-lang="' + l + '"]');
        LS.set('kazemiuon-lang', l); paint();
      });
    });
    function restoreLang(){
      var s = LS.get('kazemiuon-lang');
      if(hasLang && !userLang && s && D[s] && s !== lang()) click('#lang-popover .lang-opt[data-lang="' + s + '"]');
    }
    try{
      new MutationObserver(function(){ paint(); }).observe(root, { attributes:true, attributeFilter:['lang'] });
    }catch(e){}

    /* ----- تم ----- */
    var hasTheme = !!$('#theme-popover .theme-opt');
    if(!hasTheme){ var ct = $('#kzm-card-theme'); if(ct) ct.remove(); }
    function syncTheme(){
      var a = $('#theme-popover .theme-opt.active'); var cur = a ? a.getAttribute('data-theme') : 'default';
      $$('.kzm-themes button').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-theme') === cur)); });
    }
    $$('.kzm-themes button').forEach(function(b){
      b.addEventListener('click', function(){ click('#theme-popover .theme-opt[data-theme="' + b.getAttribute('data-theme') + '"]'); setTimeout(syncTheme, 0); syncTheme(); });
    });

    /* ----- اندازه‌ی متن ----- */
    var range = $('#kzm-size'), MIN = 70, MAX = 170;
    var legacyUp = $('#font-size-up'), legacyDown = $('#font-size-down');   /* صفحه‌ی هیئت: بزرگ‌نمایی کل بدنه */
    if(legacyUp && legacyDown) root.classList.add('kzm-bodyzoom');
    function drawRange(){
      if(range){ range.value = sizePct; range.style.setProperty('--p', ((sizePct - MIN) / (MAX - MIN) * 100) + '%'); }
      showSize();
    }
    function applySize(){
      sizePct = Math.max(MIN, Math.min(MAX, Math.round(sizePct / 10) * 10));
      if(legacyUp && legacyDown){
        var cur = parseInt(LS.get('kazemiuon-font-size'), 10) || 100, guard = 0;
        while(cur !== sizePct && guard++ < 12){
          var b = cur < sizePct ? legacyUp : legacyDown;
          if(b.disabled) break; b.click(); cur += (cur < sizePct ? 10 : -10);
        }
        root.style.setProperty('--kzm-inv', String(100 / sizePct));
      }else{
        root.style.setProperty('--kzm-zoom', String(sizePct / 100));
        LS.set('kazemiuon-font-size', String(sizePct));
      }
      drawRange();
    }
    sizePct = parseInt(LS.get('kazemiuon-font-size'), 10) || 100;
    if(range) range.addEventListener('input', function(){ sizePct = parseInt(range.value, 10) || 100; applySize(); });
    if(legacyUp && legacyDown){ sizePct = Math.max(MIN, Math.min(MAX, sizePct)); root.style.setProperty('--kzm-inv', String(100 / sizePct)); drawRange(); }
    else applySize();

    /* ----- صدا ----- */
    var sw = $('#kzm-sound'), legacySound = $('#sound-toggle');
    if(!legacySound){ var cs = $('#kzm-card-sound'); if(cs) cs.remove(); }
    function soundOn(){ return !!legacySound && legacySound.getAttribute('aria-pressed') === 'true'; }
    function syncSound(){ if(sw) sw.setAttribute('aria-checked', String(soundOn())); }
    if(sw && legacySound) sw.addEventListener('click', function(){
      legacySound.click(); syncSound(); LS.set('kazemiuon-sound', soundOn() ? '1' : '0');
    });
    (function(){
      var s = LS.get('kazemiuon-sound');
      if(legacySound && (s === '1' || s === '0') && (s === '1') !== soundOn()) legacySound.click();
      syncSound();
    })();

    /* ----- نصب اپلیکیشن ----- */
    var row = $('#pwa-install-row'), inst = $('#kzm-install');
    function syncInstall(){ if(inst) inst.hidden = !(row && getComputedStyle(row).display !== 'none'); }
    if(inst){
      inst.addEventListener('click', function(){ setOpen(false); click('#pwa-install-btn'); });
      if(row){ try{ new MutationObserver(syncInstall).observe(row, { attributes:true, attributeFilter:['style'] }); }catch(e){} }
      syncInstall();
    }

    /* ----- مرکز دانلود (فقط صفحه‌ی هیئت) ----- */
    var dl = $('#kzm-downloads');
    if(dl){
      if($('#downloads-trigger')){ dl.hidden = false; dl.addEventListener('click', function(){ setOpen(false); setTimeout(function(){ click('#downloads-trigger'); }, 60); }); }
      else dl.remove();
    }

    paint();
    restoreLang();
    window.addEventListener('load', function(){ setTimeout(function(){ restoreLang(); paint(); }, 0); });
  }catch(e){}
})();
</script>
