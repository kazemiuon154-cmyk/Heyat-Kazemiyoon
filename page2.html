<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه دوم | هیئت کاظمیون خرم‌آباد</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0e0906;
    --void-2:#150e0a;
    --crimson:#8c1518;
    --crimson-rgb:140,21,24;
    --crimson-bright:#b8241f;
    --gold:#c9a227;
    --gold-soft:#8a7040;
    --gold-dim:#5c4a28;
    --parchment:#f1e7d8;
    --parchment-dim:#a99c8a;
    --line:rgba(201,162,39,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgba(var(--crimson-rgb),0.30), transparent 55%),
      radial-gradient(ellipse 90% 50% at 15% 40%, rgba(var(--crimson-rgb),0.10), transparent 60%),
      radial-gradient(ellipse 90% 50% at 85% 75%, rgba(var(--crimson-rgb),0.12), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .page{
    width:100%;
    max-width:500px;
    padding:0 22px 60px;
    position:relative;
    z-index:1;
  }

  /* ============================================================
     THEME SYSTEM (مذهبی ۱ / مذهبی ۲ / روشن / تاریک)
     همان تعریف رنگ‌های index.html تا در دو صفحه هماهنگ بماند
  ============================================================ */
  body.theme-dark{
    --void:#000000; --void-2:#0a0a0a;
    --crimson:#6e1013; --crimson-bright:#9c2320;
    --gold:#a3853a; --gold-soft:#6f5d33; --gold-dim:#453a22;
    --parchment:#d8d0bf; --parchment-dim:#83786a;
    --line:rgba(163,133,58,0.14);
    background:#000000;
  }
  body.theme-light{
    --void:#04120a; --void-2:#071c11;
    --crimson:#39ff14; --crimson-rgb:57,255,20; --crimson-bright:#7dffb0;
    --gold:#b6ff2e; --gold-soft:#7fd11a; --gold-dim:#4a7a1e;
    --parchment:#e9ffee; --parchment-dim:#8fc79f;
    --line:rgba(57,255,20,0.28);
  }
  body.theme-fest{
    --void:#0c1220; --void-2:#121a2e;
    --crimson:#d81b60; --crimson-rgb:216,27,96; --crimson-bright:#ff4081;
    --gold:#ffca28; --gold-soft:#e0a72a; --gold-dim:#b8860b;
    --parchment:#fff6e0; --parchment-dim:#d8c9a3;
    --line:rgba(255,202,40,0.25);
  }

  /* ---------------- منوی سریع (همبرگری: تم) ---------------- */
  .quick-menu{
    position:fixed;
    top:14px; left:14px;
    z-index:65;
  }
  .quick-menu-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.75);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .quick-menu-btn svg{ width:17px; height:17px; }
  .quick-menu-btn:hover, .quick-menu-btn.active{ border-color:var(--gold-soft); color:var(--gold); }
  .quick-menu-panel{
    position:absolute;
    top:44px; left:0;
    display:flex; flex-direction:column;
    align-items:stretch;
    gap:8px;
    min-width:168px;
    padding:12px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index:65;
  }
  .quick-menu-panel.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .quick-menu-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .quick-menu-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
  }
  .theme-switch-wrap{ position:relative; }
  .theme-toggle-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .theme-toggle-btn svg{ width:15px; height:15px; }
  .theme-toggle-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .theme-popover{
    position:fixed;
    width:max-content;
    max-width:min(260px, calc(100vw - 20px));
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:row; flex-wrap:wrap;
    gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-6px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .theme-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .theme-opt{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 9px; border-radius:9px; cursor:pointer; text-align:center;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .theme-opt.active{ color:var(--void); background:var(--gold); }
  .theme-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .lang-switch-wrap{ position:relative; }
  .lang-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .lang-toggle:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .lang-toggle .lang-flag{ font-size:14px; line-height:1; }
  .lang-popover{
    position:fixed;
    transform:translateY(-6px);
    min-width:150px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:column; gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .lang-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-opt{
    display:flex; align-items:center; gap:8px;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 10px; border-radius:9px; cursor:pointer; text-align:right;
    transition:all 0.15s ease;
  }
  .lang-opt .lang-flag{ font-size:15px; line-height:1; flex:none; }
  .lang-opt.active{ color:var(--void); background:var(--gold); }
  .lang-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .sound-toggle{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .sound-toggle svg{ width:15px; height:15px; }
  .sound-toggle:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ---------------- header ---------------- */
  .page2-header{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:20px 0 8px;
  }
  .page2-back{
    position:absolute;
    right:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--gold-soft);
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    transition:all 0.18s ease;
  }
  .page2-back svg{ width:16px; height:16px; }
  .page2-back:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .page2-back:active{ transform:scale(0.94); }
  .page2-header-title{
    font-size:15px;
    font-weight:700;
    color:var(--parchment);
  }

  /* ---------------- logo mini ---------------- */
  .mini-logo-wrap{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .mini-logo{
    width:64px; height:64px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------------- group label ---------------- */
  .group-label{
    font-size:12px;
    color:var(--gold-soft);
    letter-spacing:0.1em;
    margin:26px 4px 14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  /* ---------------- نذورات card ---------------- */
  .nazr-card{
    padding:22px 18px;
    border-radius:18px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), var(--void);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 24px rgba(0,0,0,0.28);
    text-align:center;
  }
  .nazr-number-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .nazr-number{
    font-size:17px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.03em;
  }
  .copy-btn{
    width:38px; height:38px; min-width:38px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.18s ease;
  }
  .copy-btn svg{ width:16px; height:16px; }
  .copy-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .copy-btn:active{ transform:scale(0.92); }
  .nazr-name{
    font-size:13.5px;
    color:var(--parchment-dim);
    font-weight:600;
  }

  /* ---------------- toast ---------------- */
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(20,14,10,0.95);
    color:var(--parchment);
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:200;
    box-shadow:0 10px 24px rgba(0,0,0,0.4);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:11.5px;
    color:var(--gold-dim);
  }
</style>
</head>
<body>

<div class="quick-menu" id="quick-menu">
  <button type="button" id="quick-menu-btn" class="quick-menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="منوی تنظیمات تم">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="quick-menu-panel" id="quick-menu-panel" role="menu">
    <div class="quick-menu-row">
      <span class="quick-menu-label" data-i18n="quickMenuTheme">تم</span>
      <div class="theme-switch-wrap">
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="تغییر تم" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3.5c-4.7 0-8.5 3.6-8.5 8 0 3 2 4.3 3.6 4.3.8 0 1.1-.4 1.6-.9.5-.5.9-.9 1.7-.9 1.5 0 1.9 1 1.9 2.1 0 .9-.4 1.6-.4 2.2 0 .8.6 1.2 1.7 1.2 4.6 0 8.4-3.9 8.4-8.4 0-4.8-3.9-7.6-10-7.6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="8.2" cy="9.3" r="1.15" fill="currentColor"/>
            <circle cx="12.2" cy="7.1" r="1.15" fill="currentColor"/>
            <circle cx="16.3" cy="9.3" r="1.15" fill="currentColor"/>
            <circle cx="17.3" cy="13.6" r="1.15" fill="currentColor"/>
          </svg>
        </button>
        <div class="theme-popover" id="theme-popover" role="menu">
          <button type="button" class="theme-opt" data-theme="fest">مذهبی ۱</button>
          <button type="button" class="theme-opt active" data-theme="default">مذهبی ۲</button>
          <button type="button" class="theme-opt" data-theme="light">سبز فسفری</button>
          <button type="button" class="theme-opt" data-theme="dark">تاریک</button>

      <span class="quick-menu-label" data-i18n="quickMenuLang">زبان</span>

        <button type="button" id="lang-toggle" class="lang-toggle" aria-haspopup="true" aria-expanded="false" aria-label="انتخاب زبان">
          <span class="lang-flag" id="lang-toggle-flag">🇮🇷</span>

        </button>
        <div class="lang-popover" id="lang-popover" role="menu">

          <button type="button" class="lang-opt" data-lang="ar" data-flag="🇮🇶" data-code="عربي">
            <span class="lang-flag">🇮🇶</span><span>العربية</span>
          </button>
          <button type="button" class="lang-opt" data-lang="en" data-flag="🇬🇧" data-code="EN">
            <span class="lang-flag">🇬🇧</span><span>English</span>
          </button>
        </div>
      </div>
    </div>
    <div class="quick-menu-row">
      <span class="quick-menu-label" data-i18n="quickMenuSound">صدا</span>
      <button type="button" id="sound-toggle" class="sound-toggle" aria-label="قطع/وصل صدا" aria-pressed="false">
        <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4 4 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18.5 6a7.5 7.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="page">

  <div class="page2-header">
    <a href="index.html" class="page2-back" aria-label="بازگشت به صفحه اول">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="backBtn">بازگشت</span>

  </div>

  <div class="group-label">

  </div>

  <div class="nazr-card">

      <span class="nazr-number" id="nazr-number" dir="ltr">6104&nbsp;3311&nbsp;3307&nbsp;0012</span>
      <button type="button" class="copy-btn" id="copy-nazr-number" aria-label="کپی شماره کارت">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6"/></svg>

</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, successMsg){
    try{
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast(successMsg); }catch(e2){}
      document.body.removeChild(ta);
    }
  }

  (function nazrCopy(){
    const btn = document.getElementById('copy-nazr-number');
    const numEl = document.getElementById('nazr-number');
    if(!btn || !numEl) return;
    btn.addEventListener('click', () => {
      const digitsOnly = numEl.textContent.replace(/[^0-9]/g, '');
      copyText(digitsOnly, 'شماره کارت کپی شد');
    });
  })();

  // ---------------- تغییر و همگام‌سازی تم با صفحه اول ----------------
  (function themeSwitcher(){
    const toggle = document.getElementById('theme-toggle');
    const popover = document.getElementById('theme-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.theme-opt');

    document.body.appendChild(popover);

    function applyTheme(theme){
      document.body.classList.remove('theme-light', 'theme-dark', 'theme-fest');
      if(theme === 'light') document.body.classList.add('theme-light');
      else if(theme === 'dark') document.body.classList.add('theme-dark');
      else if(theme === 'fest') document.body.classList.add('theme-fest');
      opts.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      try{ localStorage.setItem('kazemiuon-theme', theme); }catch(e){}
    }

    let saved = 'default';
    try{ saved = localStorage.getItem('kazemiuon-theme') || 'default'; }catch(e){}
    applyTheme(saved);

    function positionThemePopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 132;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const top = rect.top - popover.offsetHeight - 8;
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionThemePopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionThemePopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        applyTheme(b.dataset.theme);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- باز/بسته شدن منوی همبرگری ----------------
  (function quickMenu(){
    const btn = document.getElementById('quick-menu-btn');
    const panel = document.getElementById('quick-menu-panel');
    if(!btn || !panel) return;

    function closePanel(){
      panel.classList.remove('show');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const themePop = document.getElementById('theme-popover');
      const langPop = document.getElementById('lang-popover');
      if(themePop) themePop.classList.remove('show');
      if(langPop) langPop.classList.remove('show');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      btn.classList.toggle('active', show);
      btn.setAttribute('aria-expanded', String(show));
    });

    document.addEventListener('click', (e) => {
      if(!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
        closePanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closePanel();
    });
  })();

  // ---------------- ترجمه‌ها ----------------
  const translations = {
    fa: {
      backBtn: 'بازگشت',
      pageTitle: 'صفحه دوم',
      nazrTitle: 'نذورات',
      nazrName: 'به نام: مسعود زندیه شیرازی',
      footerSub: 'پایگاه اطلاع‌رسانی هیئت کاظمیون خرم‌آباد',
      quickMenuTheme: 'تم',
      quickMenuLang: 'زبان',
      quickMenuSound: 'صدا'
    },
    ar: {
      backBtn: 'رجوع',
      pageTitle: 'الصفحة الثانية',
      nazrTitle: 'النذور',
      nazrName: 'باسم: مسعود زنديه شيرازي',
      footerSub: 'القناة الرسمية لموكب الكاظميون خرم‌آباد',
      quickMenuTheme: 'المظهر',
      quickMenuLang: 'اللغة',
      quickMenuSound: 'الصوت'
    },
    en: {
      backBtn: 'Back',
      pageTitle: 'Page Two',
      nazrTitle: 'Donations',
      nazrName: 'In the name of: Masoud Zandiyeh Shirazi',
      footerSub: 'Official channel of Heyat-e Kazemiyoon Khorramabad',
      quickMenuTheme: 'Theme',
      quickMenuLang: 'Language',
      quickMenuSound: 'Sound'
    }
  };

  let currentLang = 'fa';

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[lang][key] !== undefined){
        el.textContent = translations[lang][key];
      }
    });
    const activeOpt = document.querySelector('.lang-opt[data-lang="' + lang + '"]');
    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if(activeOpt){
      const flagEl = document.getElementById('lang-toggle-flag');
      const codeEl = document.getElementById('lang-toggle-code');
      if(flagEl) flagEl.textContent = activeOpt.dataset.flag;
      if(codeEl) codeEl.textContent = activeOpt.dataset.code;
    }
  }

  // ---------------- تغییر زبان ----------------
  (function langSwitcher(){
    const toggle = document.getElementById('lang-toggle');
    const popover = document.getElementById('lang-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.lang-opt');

    document.body.appendChild(popover);

    function positionLangPopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 150;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const ph = popover.offsetHeight || 140;
      let top = rect.bottom + 8;
      if(top + ph > window.innerHeight - margin){
        top = rect.top - ph - 8;
      }
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionLangPopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionLangPopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        setLang(b.dataset.lang);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- دکمه صدا (افکت تیک کلیک) ----------------
  (function soundToggle(){
    const soundState = { muted: true, ctx: null };
    function ensureAudioCtx(){
      if(!soundState.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) soundState.ctx = new AC();
      }
      return soundState.ctx;
    }
    function playTick(){
      if(soundState.muted) return;
      const ctx = ensureAudioCtx();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime;
      osc.frequency.setValueAtTime(720, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.16);
    }
    document.querySelectorAll('.lang-opt, .lang-toggle, .theme-opt, .copy-btn').forEach(el => {
      el.addEventListener('click', playTick);
    });
    const btn = document.getElementById('sound-toggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      soundState.muted = !soundState.muted;
      btn.setAttribute('aria-pressed', String(!soundState.muted));
      btn.querySelector('.icon-sound-on').style.display = soundState.muted ? 'none' : 'block';
      btn.querySelector('.icon-sound-off').style.display = soundState.muted ? 'block' : 'none';
      if(!soundState.muted){ ensureAudioCtx(); playTick(); }
    });
  })();
</script>
