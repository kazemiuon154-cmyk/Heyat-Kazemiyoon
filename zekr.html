<html lang="fa" dir="rtl">

<title>ذکر روز | هیئت کاظمیون خرم‌آباد</title>
<meta name="description" content="ذکر هر روز هفته به همراه ترجمه فارسی، شمارشگر ۱۰۰ تایی، رکورد روزهای متوالی و نوار پیشرفت روز.">

<style>
  :root{
    --void:#071710;
    --void-2:#0e2419;
    --crimson:#0e9b62;
    --crimson-rgb:14,155,98;
    --crimson-bright:#22c17f;
    --crimson-deep:#053d27;
    --ember:#ffd166;
    --ember-soft:#ffd16666;
    --gold:#ffcb3d;
    --gold-soft:#d1a52a;
    --gold-dim:#8a6e1e;
    --parchment:#f3ead0;
    --parchment-dim:#a99b78;
    --line:rgba(255,203,61,0.22);
    --glass:rgba(255,255,255,0.05);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgba(var(--crimson-rgb),0.30), transparent 55%),
      radial-gradient(ellipse 90% 50% at 15% 40%, rgba(var(--crimson-rgb),0.10), transparent 60%),
      radial-gradient(ellipse 90% 50% at 85% 75%, rgba(var(--crimson-rgb),0.12), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    animation:zekrPageFadeIn 0.4s ease;
    transition:opacity 0.28s ease, transform 0.28s ease;
  }
  @keyframes zekrPageFadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  body.page-exit{ opacity:0; transform:translateY(-8px); }

  /* ---------------- ذرات ریز طلایی پس‌زمینه ---------------- */
  .embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ember-spark{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 6px 1px var(--ember-soft);
    opacity:0;
    animation-name:rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.9; }
    80%{ opacity:0.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember-spark{ display:none; }
  }

  .page{
    width:100%;
    max-width:500px;
    padding:0 22px 60px;
    position:relative;
    z-index:1;
  }

  /* ---------------- header ---------------- */
  .zekr-page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:20px 0 8px;
  }
  .zekr-page-back{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:linear-gradient(135deg, var(--gold-bright, var(--gold)), var(--crimson-bright));
    background-size:200% 200%;
    color:#1a0f04;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.02em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12);
    transition:all 0.2s ease, transform 0.25s ease;
    animation:zekrBackPulse 2.6s ease-in-out infinite, zekrBackShine 5s linear infinite;
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:60;
    overflow:hidden;
  }
  .zekr-page-back::after{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:zekrBackSweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes zekrBackSweep{
    0%{ transform:translateX(0) skewX(-20deg); }
    38%{ transform:translateX(543%) skewX(-20deg); }
    100%{ transform:translateX(543%) skewX(-20deg); }
  }
  .zekr-page-back svg{ width:16px; height:16px; flex:none; }
  .zekr-page-back:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 2px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(var(--crimson-rgb),0.55), 0 0 0 5px rgba(var(--crimson-rgb),0.18); }
  .zekr-page-back:active{ transform:scale(0.94); }
  @keyframes zekrBackPulse{
    0%,100%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12); }
    50%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 26px rgba(var(--crimson-rgb),0.65), 0 0 0 8px rgba(var(--crimson-rgb),0.05); }
  }
  @keyframes zekrBackShine{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .zekr-page-header-title{
    flex:1;
    min-width:0;
    text-align:center;
    font-size:15px;
    font-weight:700;
    color:var(--parchment);
    overflow-wrap:break-word;
  }

  /* ---------------- logo mini ---------------- */
  .mini-logo-wrap{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .mini-logo{
    width:64px; height:64px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ============================================================
     ZEKR CARD (ذکر روز)
  ============================================================ */
  .zekr-card{
    margin:0 0 8px;
    padding:22px 20px 20px;
    border-radius:20px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,203,61,0.06), rgba(255,255,255,0.01)), var(--void);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 24px rgba(0,0,0,0.28);
    text-align:center;
  }
  .zekr-header{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12.5px; font-weight:600; color:var(--gold);
    letter-spacing:0.06em; margin-bottom:12px;
  }
  .zekr-header svg{ width:15px; height:15px; }
  .zekr-day{
    font-size:12.5px; color:var(--gold-soft); font-weight:700; margin-bottom:8px;
  }
  .zekr-phrase{
    font-family:'Amiri', serif;
    font-size:19px; line-height:1.9; color:var(--parchment);
    padding:0 4px;
  }
  .zekr-phrase-fa{
    font-size:12.5px; line-height:1.8; color:var(--parchment-dim);
    padding:0 6px;
    margin-bottom:18px;
    margin-top:4px;
  }
  .zekr-counter-wrap{
    display:flex; justify-content:center; margin-bottom:14px;
  }
  .zekr-ring-btn{
    position:relative;
    width:132px; height:132px;
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .zekr-ring-btn:active{ transform:scale(0.94); }
  .zekr-ring-btn.pulse .zekr-ring-core{ animation:zekrPulse 0.4s ease; }
  .zekr-ring-btn.pulse .zekr-ring-glow{ animation:zekrGlowPulse 0.5s ease; }
  @keyframes zekrPulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.12); }
    100%{ transform:scale(1); }
  }
  @keyframes zekrGlowPulse{
    0%{ opacity:0.35; transform:scale(0.9); }
    50%{ opacity:0.8; transform:scale(1.15); }
    100%{ opacity:0.45; transform:scale(1); }
  }
  .zekr-ring-glow{
    position:absolute; inset:6px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,203,61,0.35), rgba(255,203,61,0) 70%);
    opacity:0.45;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .zekr-ring{
    position:absolute; inset:0; width:100%; height:100%;
    transform:rotate(-90deg);
    filter:drop-shadow(0 0 6px rgba(255,203,61,0.25));
  }
  .zekr-ring-bg{
    fill:none; stroke:rgba(255,255,255,0.08); stroke-width:8;
  }
  .zekr-ring-fg{
    fill:none; stroke:var(--gold); stroke-width:9; stroke-linecap:round;
    stroke-dasharray:326.7256;
    stroke-dashoffset:326.7256;
    transition:stroke-dashoffset 0.35s ease;
  }
  .zekr-ring-fg.done{ stroke:var(--crimson-bright); filter:drop-shadow(0 0 5px rgba(255,90,90,0.5)); }
  .zekr-ring-core{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:94px; height:94px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, rgba(255,255,255,0.06), rgba(0,0,0,0.15) 75%), var(--void);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -6px 14px rgba(0,0,0,0.35);
  }
  .zekr-count-num{
    font-size:32px; font-weight:800; color:var(--parchment); line-height:1;
  }
  .zekr-count-total{
    margin-top:2px;
    text-align:center; font-size:11px; color:var(--parchment-dim); font-weight:600;
  }

  /* quick +N / undo row */
  .zekr-quick-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:14px;
  }
  .zekr-quick-btn{
    background:var(--glass);
    border:1px solid var(--line);
    color:var(--gold-soft);
    font-family:inherit;
    font-size:12px; font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, transform 0.12s ease;
  }
  .zekr-quick-btn:hover{ background:rgba(255,203,61,0.1); color:var(--gold); }
  .zekr-quick-btn:active{ transform:scale(0.94); }
  .zekr-undo-btn{
    display:flex; align-items:center; gap:5px;
    background:var(--glass);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:inherit;
    font-size:12px; font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, opacity 0.2s ease, transform 0.12s ease;
  }
  .zekr-undo-btn svg{ width:13px; height:13px; }
  .zekr-undo-btn:hover{ background:rgba(255,255,255,0.08); color:var(--parchment); }
  .zekr-undo-btn:active{ transform:scale(0.94); }
  .zekr-undo-btn:disabled{ opacity:0.35; cursor:default; }

  .zekr-hint{
    font-size:11.5px; color:var(--parchment-dim); margin-bottom:14px;
  }
  .zekr-actions{ display:flex; justify-content:center; }
  .zekr-reset-btn{
    background:var(--glass);
    border:1px solid var(--line);
    color:var(--gold-soft);
    font-family:inherit;
    font-size:12px; font-weight:600;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .zekr-reset-btn:hover{ background:rgba(255,203,61,0.1); color:var(--gold); }

  .zekr-day-progress{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .zekr-day-progress-track{
    position:relative;
    width:100%; height:5px;
    border-radius:999px;
    background:rgba(255,255,255,0.07);
    overflow:hidden;
  }
  .zekr-day-progress-fill{
    position:absolute; top:0; bottom:0; right:0;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold), var(--gold-soft));
    transition:width 1.2s ease, background 0.6s ease;
  }
  .zekr-day-progress-fill.urgent{
    background:linear-gradient(90deg, var(--crimson-bright), #ff9b6a);
  }
  .zekr-day-progress-fill.complete{
    background:linear-gradient(90deg, #35c26b, #8ee6a8);
  }
  .zekr-day-progress-label{
    margin-top:8px;
    text-align:center;
    font-size:11px; font-weight:600;
    color:var(--parchment-dim);
  }
  .zekr-day-progress-label.urgent{ color:var(--crimson-bright); }
  .zekr-day-progress-label.complete{ color:#5fd88a; }

  /* ---------------- streak card ---------------- */
  .streak-card{
    margin-top:14px;
    padding:16px 18px;
    border-radius:18px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,203,61,0.05), rgba(255,255,255,0.01)), var(--void);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 8px 20px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .streak-block{ text-align:center; flex:1; }
  .streak-num{ font-size:22px; font-weight:800; color:var(--gold); line-height:1; }
  .streak-emoji{ font-size:18px; }
  .streak-label{ font-size:11px; color:var(--parchment-dim); margin-top:4px; }
  .streak-divider{ width:1px; align-self:stretch; background:var(--line); }

  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--void-2);
    border:1px solid var(--line);
    color:var(--parchment);
    padding:10px 18px;
    border-radius:999px;
    font-size:12.5px; font-weight:600;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:60;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============================================================
     THEME SYSTEM (پیش‌فرض: سبز و طلایی / و ۸ تم جایگزین)
     همان تعریف رنگ‌های سایر صفحات تا در کل سایت هماهنگ بماند
  ============================================================ */
  body.theme-dark{
    --void:#000000; --void-2:#0a0a0a;
    --crimson:#6e1013; --crimson-bright:#9c2320;
    --gold:#a3853a; --gold-soft:#6f5d33; --gold-dim:#453a22;
    --parchment:#d8d0bf; --parchment-dim:#83786a;
    --line:rgba(163,133,58,0.14);
    background:#000000;
  }
  body.theme-light{
    --void:#04120a; --void-2:#071c11;
    --crimson:#39ff14; --crimson-rgb:57,255,20; --crimson-bright:#7dffb0;
    --gold:#b6ff2e; --gold-soft:#7fd11a; --gold-dim:#4a7a1e;
    --parchment:#e9ffee; --parchment-dim:#8fc79f;
    --line:rgba(57,255,20,0.28);
  }
  body.theme-fest{
    --void:#0c1220; --void-2:#121a2e;
    --crimson:#d81b60; --crimson-rgb:216,27,96; --crimson-bright:#ff4081;
    --gold:#ffca28; --gold-soft:#e0a72a; --gold-dim:#b8860b;
    --parchment:#fff6e0; --parchment-dim:#d8c9a3;
    --line:rgba(255,202,40,0.25);
  }
  body.theme-crimson{
    --void:#0e0906; --void-2:#150e0a;
    --crimson:#8c1518; --crimson-rgb:140,21,24; --crimson-bright:#b8241f;
    --gold:#c9a227; --gold-soft:#8a7040; --gold-dim:#5c4a28;
    --parchment:#f1e7d8; --parchment-dim:#a99c8a;
    --line:rgba(201,162,39,0.16);
  }
  body.theme-lilac{
    --void:#160a1e; --void-2:#1f1029;
    --crimson:#c65bd6; --crimson-rgb:198,91,214; --crimson-bright:#e28ae8;
    --gold:#f0c94e; --gold-soft:#caa53a; --gold-dim:#8a6f28;
    --parchment:#fbeefc; --parchment-dim:#c3a8c9;
    --line:rgba(240,201,78,0.22);
  }
  body.theme-sunset{
    --void:#071c22; --void-2:#0d2a32;
    --crimson:#ff7a45; --crimson-rgb:255,122,69; --crimson-bright:#ff9d6e;
    --gold:#ffcf6b; --gold-soft:#dba63e; --gold-dim:#8f6c22;
    --parchment:#fff3e6; --parchment-dim:#c8b39c;
    --line:rgba(32,196,196,0.25);
  }
  body.theme-amber{
    --void:#1c130a; --void-2:#241a0e;
    --crimson:#c8752b; --crimson-rgb:200,117,43; --crimson-bright:#e29344;
    --gold:#f0c14b; --gold-soft:#cb9f33; --gold-dim:#836a20;
    --parchment:#fbf1dc; --parchment-dim:#c9b998;
    --line:rgba(240,193,75,0.22);
  }
  body.theme-sky{
    --void:#081521; --void-2:#0e2032;
    --crimson:#2f8ce0; --crimson-rgb:47,140,224; --crimson-bright:#5fadf5;
    --gold:#ffd35c; --gold-soft:#d9ac3c; --gold-dim:#8f7126;
    --parchment:#f0f8ff; --parchment-dim:#a9c2d6;
    --line:rgba(127,212,255,0.22);
  }

  /* ---------------- منوی سریع (همبرگری: تم/زبان/صدا) ---------------- */
  .quick-menu{ position:fixed; top:14px; left:14px; z-index:65; }
  .quick-menu-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.75);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s ease;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  .quick-menu-btn svg{ width:17px; height:17px; }
  .quick-menu-btn:hover, .quick-menu-btn.active{ border-color:var(--gold-soft); color:var(--gold); }
  .quick-menu-panel{
    position:absolute; top:44px; left:0;
    display:flex; flex-direction:column; align-items:stretch; gap:8px;
    min-width:168px; padding:12px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index:65;
  }
  .quick-menu-panel.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .quick-menu-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .quick-menu-label{ font-family:'Vazirmatn', sans-serif; font-size:11.5px; font-weight:600; color:var(--parchment-dim); }
  .theme-switch-wrap{ position:relative; }
  .theme-toggle-btn{
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s ease;
  }
  .theme-toggle-btn svg{ width:15px; height:15px; }
  .theme-toggle-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .theme-popover{
    position:fixed; width:max-content; max-width:min(260px, calc(100vw - 20px));
    background:var(--void-2, var(--void));
    border:1px solid var(--line); border-radius:14px; padding:6px;
    display:flex; flex-direction:row; flex-wrap:wrap; gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .theme-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .theme-opt{
    font-family:'Vazirmatn', sans-serif; font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 9px; border-radius:9px; cursor:pointer; text-align:center;
    white-space:nowrap; transition:all 0.15s ease;

  .lang-opt .lang-flag{ font-size:15px; line-height:1; flex:none; }
  .lang-opt.active{ color:var(--void); background:var(--gold); }
  .lang-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .sound-toggle{
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);

    cursor:pointer; transition:all 0.2s ease;

/* =====================================================================
   منوی تنظیمات (نسخه‌ی جدید، هم‌شکل منوی صفحه‌ی ورود): قرص «تنظیمات» + صفحه‌ی شیشه‌ای
   زبان، تم، اندازه‌ی متن، صدا، نصب اپ، مرکز دانلود، راهنمای سایت
   ===================================================================== */
.quick-menu[hidden]{ display:none !important; }
.kzm-menu-btn{
  appearance:none; -webkit-appearance:none; font-family:inherit; cursor:pointer;
  position:fixed; top:14px; left:14px; z-index:65;
  display:inline-flex; align-items:center; gap:7px; height:30px; padding-inline:4px 12px; border-radius:999px;
  border:1px solid rgba(255,203,61,0.4); color:var(--parchment,#f4e8d0); font-size:11.5px; font-weight:800; line-height:1; white-space:nowrap;
  background:linear-gradient(135deg, rgba(255,203,61,0.16), rgba(255,203,61,0.03)), var(--void-2, #0a1d14);
  box-shadow:0 6px 14px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);

  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover){ .kzm-menu-btn:hover{ border-color:var(--gold); box-shadow:0 6px 16px -6px rgba(0,0,0,0.6), 0 0 14px rgba(255,203,61,0.25), inset 0 1px 0 rgba(255,255,255,0.1); } }
.kzm-menu-btn:active{ transform:scale(.95); }
.kzm-menu-btn:focus-visible, .kzm-menu :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.kzm-menu-ic{ flex:none; width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(255,203,61,0.2); box-shadow:inset 0 0 0 1px rgba(255,203,61,0.34); }
.kzm-menu-ic svg{ width:12px; height:12px; fill:none; stroke:var(--gold); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

/* بزرگ‌نمایی محتوای صفحه (خود منو ثابت می‌ماند) */
html:not(.kzm-bodyzoom) .page{ zoom:var(--kzm-zoom, 1); }
html.kzm-bodyzoom .kzm-menu-btn, html.kzm-bodyzoom .kzm-overlay{ zoom:var(--kzm-inv, 1); }

/* پرده‌ی پشت و کارت تنظیمات */
.kzm-overlay{
  position:fixed; inset:0; z-index:400; display:flex; justify-content:center; align-items:flex-start; padding:14px;
  background:rgba(3,10,7,0.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
  font-family:'Vazirmatn', sans-serif; color:var(--parchment,#f4e8d0);
}
.kzm-overlay.open{ opacity:1; visibility:visible; }
.kzm-menu{
  width:min(344px, 100%); max-height:calc(100vh - 28px); overflow-y:auto; padding:16px 16px 16px; border-radius:26px;
  border:1px solid rgba(255,203,61,0.36);
  background:
    radial-gradient(110% 55% at 50% 0%, rgba(255,203,61,0.18), transparent 62%),
    linear-gradient(180deg, var(--void-2, #112d1f), var(--void, #06120c));
  box-shadow:0 26px 60px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.09);
  transform:translateY(-16px) scale(.96); transition:transform .3s cubic-bezier(.2,1.1,.3,1);
}
.kzm-overlay.open .kzm-menu{ transform:none; }
.kzm-menu-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.kzm-menu-title{ display:inline-flex; align-items:center; gap:9px; font-size:16px; font-weight:900; color:var(--gold); }
.kzm-menu-title::before{ content:''; width:8px; height:8px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 10px rgba(255,203,61,0.7); }
.kzm-close{ appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; flex:none; width:32px; height:32px; padding:0; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,203,61,0.1); border:1px solid rgba(255,203,61,0.3); color:var(--gold); transition:background .2s ease; }
.kzm-close:active{ background:rgba(255,203,61,0.24); }
.kzm-close svg{ width:13px; height:13px; }
.kzm-card{ margin-top:10px; padding:12px 12px 13px; border-radius:18px; border:1px solid rgba(255,203,61,0.16); background:rgba(255,255,255,0.035); }
.kzm-card[hidden]{ display:none; }
.kzm-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.kzm-card-title{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:var(--parchment,#f4e8d0); }
.kzm-ic{ flex:none; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; background:rgba(255,203,61,0.13); box-shadow:inset 0 0 0 1px rgba(255,203,61,0.28); }
.kzm-ic svg{ width:14px; height:14px; fill:none; stroke:var(--gold); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.kzm-val{ font-size:12.5px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; }

/* زبان: سه کاشی انتخابی */
.kzm-langs{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.kzm-langs button{
  appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px 9px; border-radius:16px;
  border:1px solid rgba(255,203,61,0.2); background:rgba(4,14,9,0.55); color:rgba(244,232,208,0.78);
  transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.kzm-langs button:active{ transform:scale(.96); }
.kzm-langs .g.flag{ display:block; width:34px; height:23px; margin:2px 0 3px; border-radius:5px; overflow:hidden; line-height:0; box-shadow:0 0 0 1px rgba(255,255,255,0.28), 0 2px 6px rgba(0,0,0,0.45); }
.kzm-langs .g.flag img{ display:block; width:100%; height:100%; object-fit:cover; }
.kzm-langs button[aria-checked="true"] .g.flag{ box-shadow:0 0 0 1.5px rgba(255,203,61,0.9), 0 0 10px rgba(255,203,61,0.35); }
.kzm-langs .n{ font-size:10.5px; font-weight:700; line-height:1.4; opacity:.85; }
.kzm-langs button[aria-checked="true"], .kzm-themes button[aria-checked="true"]{
  color:var(--gold); border-color:rgba(255,203,61,0.85);
  background:radial-gradient(90% 90% at 50% 0%, rgba(255,203,61,0.26), rgba(255,203,61,0.06));
  box-shadow:0 0 16px rgba(255,203,61,0.22), inset 0 1px 0 rgba(255,255,255,0.14);
}
.kzm-langs button[aria-checked="true"]::after, .kzm-themes button[aria-checked="true"]::after{ content:''; position:absolute; top:6px; inset-inline-end:6px; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,203,61,0.9); }

/* تم: کاشی‌های رنگی */
.kzm-themes{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.kzm-themes button{
  appearance:none; -webkit-appearance:none; font:inherit; cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 4px 8px; border-radius:14px;
  border:1px solid rgba(255,203,61,0.2); background:rgba(4,14,9,0.45); color:rgba(244,232,208,0.78);
  transition:background .2s ease, border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.kzm-themes button:active{ transform:scale(.96); }
.kzm-themes .sw{ display:block; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--a), var(--b)); box-shadow:0 0 0 1px rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.45); }
.kzm-themes .n{ font-size:9.5px; font-weight:700; line-height:1.35; text-align:center; opacity:.9; }

/* اندازه‌ی متن: لغزنده */
.kzm-sizebox{ display:flex; align-items:center; gap:10px; direction:ltr; }
.kzm-sizebox .a{ flex:none; font-weight:900; color:rgba(244,232,208,0.7); line-height:1; }
.kzm-sizebox .a.s{ font-size:12px; } .kzm-sizebox .a.l{ font-size:21px; }
.kzm-range{ -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:24px; margin:0; background:transparent; cursor:pointer; --p:30%; }
.kzm-range::-webkit-slider-runnable-track{ height:6px; border-radius:999px; background:linear-gradient(90deg, #e9aa1c, var(--gold) var(--p), rgba(255,255,255,0.14) var(--p)); }
.kzm-range::-moz-range-track{ height:6px; border-radius:999px; background:rgba(255,255,255,0.14); }
.kzm-range::-moz-range-progress{ height:6px; border-radius:999px; background:linear-gradient(90deg, #e9aa1c, var(--gold)); }
.kzm-range::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 60%, #e9aa1c); border:2px solid #07170f; box-shadow:0 0 0 1px rgba(255,203,61,0.7), 0 3px 10px rgba(0,0,0,0.55); }
.kzm-range::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 60%, #e9aa1c); border:2px solid #07170f; box-shadow:0 0 0 1px rgba(255,203,61,0.7), 0 3px 10px rgba(0,0,0,0.55); }
.kzm-range:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:8px; }

/* صدا / نصب / دانلود / راهنما: کاشی‌های ردیفی */
.kzm-pair{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
.kzm-pair .kzm-card{ margin-top:0; display:flex; align-items:center; gap:9px; padding:11px 12px; text-decoration:none; color:inherit; min-width:0; font:inherit; text-align:start; width:100%; }
.kzm-pair .kzm-card[hidden]{ display:none; }
.kzm-pair .kzm-card .kzm-card-title{ flex:1; min-width:0; }
button.kzm-card{ appearance:none; -webkit-appearance:none; cursor:pointer; color:var(--parchment,#f4e8d0); }
.kzm-switch{ appearance:none; -webkit-appearance:none; cursor:pointer; flex:none; position:relative; width:42px; height:24px; padding:0; border-radius:999px; border:1px solid rgba(255,203,61,0.28); background:rgba(255,255,255,0.1); transition:background .25s ease, border-color .25s ease; }
.kzm-switch i{ position:absolute; top:2px; inset-inline-start:2px; width:18px; height:18px; border-radius:50%; background:#f4e8d0; box-shadow:0 2px 6px rgba(0,0,0,0.5); transition:inset-inline-start .25s cubic-bezier(.3,1.3,.5,1), background .25s ease; }
.kzm-switch[aria-checked="true"]{ background:linear-gradient(135deg, #ffe58f, var(--gold) 60%, #e9aa1c); border-color:rgba(255,226,138,0.8); }
.kzm-switch[aria-checked="true"] i{ inset-inline-start:20px; background:#2a1d00; }
.kzm-guide{ border-color:rgba(255,203,61,0.34) !important; background:linear-gradient(135deg, rgba(255,203,61,0.16), rgba(255,203,61,0.04)) !important; transition:border-color .2s ease, transform .2s ease; }
.kzm-guide:active{ transform:scale(.97); }
@media (hover:hover){ .kzm-guide:hover{ border-color:rgba(255,203,61,0.7) !important; } }
.kzm-chev{ flex:none; width:15px; height:15px; fill:none; stroke:var(--gold); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
html[dir="ltr"] .kzm-chev{ transform:scaleX(-1); }
@media (max-width:359px){ .kzm-menu{ padding:14px 12px; } }
@media (prefers-reduced-motion: reduce){ .kzm-overlay, .kzm-menu, .kzm-switch i{ transition:none; } }

<script>
  // ---------------- کمکی: ساعت/تاریخ رسمی تهران، مستقل از تایم‌زون مرورگر بازدیدکننده ----------------
  function getTehranParts(date){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'Asia/Tehran', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, weekday:'short'
    });
    const map = {};
    fmt.formatToParts(date).forEach(p => { map[p.type] = p.value; });
    return map;
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

    const elTotal = document.getElementById('zekr-count-total');
    const elRing = document.getElementById('zekr-ring-fg');
    const btnCount = document.getElementById('zekr-count-btn');
    const btnReset = document.getElementById('zekr-reset-btn');
    const btnUndo = document.getElementById('zekr-undo-btn');
    const btnPlus10 = document.getElementById('zekr-plus10-btn');
    if(!elDay || !elPhrase || !elNum || !elRing || !btnCount || !btnReset) return;

    const TARGET = 100;
    const CIRCUMFERENCE = 326.7256;

    // ذکر هر روز هفته به همراه ترجمه فارسی، هماهنگ با تقویم رسمی ایران (شنبه اولین روز هفته)
    const weekdayMap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    const ZEKR_BY_DAY = {
      6: { day:"شنبه",     text:"يا رَبَّ العالَمين",            fa:"ای پروردگار جهانیان" },
      0: { day:"یک‌شنبه",   text:"يا ذَاالجَلالِ وَ الاِکرام",     fa:"ای صاحبِ جلال و بزرگواری" },
      1: { day:"دوشنبه",    text:"يا قاضِیَ الحاجات",             fa:"ای برآورندهٔ حاجت‌ها" },
      2: { day:"سه‌شنبه",   text:"يا اَرحَمَ الرّاحِمین",          fa:"ای مهربان‌ترینِ مهربانان" },
      3: { day:"چهارشنبه",  text:"يا حَیُّ یا قَیّوم",             fa:"ای زنده، ای پاینده" },
      4: { day:"پنج‌شنبه",  text:"لا اِلهَ اِلاَّ اللهُ المَلِکُ الحَقُّ المُبین", fa:"هیچ معبودی جز خدای پادشاهِ حق و آشکار نیست" },
      5: { day:"جمعه",      text:"اَللّهُمَّ صَلِّ عَلی مُحَمَّدٍ وَ آلِ مُحَمَّد", fa:"خدایا بر محمد و خاندان محمد درود فرست" }
    };

    const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    function toFaNum(n){ return String(n).split('').map(ch => (ch >= '0' && ch <= '9') ? faDigits[ch] : ch).join(''); }

    function keyForOffset(offsetDays){
      const shifted = new Date(Date.now() - offsetDays * 86400000);
      const p = getTehranParts(shifted);
      return 'kazemiuon-zekr-' + p.year + '-' + p.month + '-' + p.day;
    }
    function todayKey(){ return keyForOffset(0); }

    function loadCount(key){
      try{
        const v = parseInt(localStorage.getItem(key), 10);
        return (isNaN(v) || v < 0) ? 0 : Math.min(v, TARGET);
      }catch(e){ return 0; }
    }
    function saveCount(key, val){
      try{ localStorage.setItem(key, String(val)); }catch(e){}
    }
    function loadBestStreak(){
      try{
        const v = parseInt(localStorage.getItem('kazemiuon-zekr-best-streak'), 10);
        return (isNaN(v) || v < 0) ? 0 : v;
      }catch(e){ return 0; }
    }
    function saveBestStreak(v){
      try{ localStorage.setItem('kazemiuon-zekr-best-streak', String(v)); }catch(e){}
    }

    let currentKey = todayKey();
    let currentDayIndex = null;
    let count = 0;

    function updateRing(){
      const ratio = Math.min(count / TARGET, 1);
      elRing.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - ratio));
      elRing.classList.toggle('done', count >= TARGET);
      elNum.textContent = toFaNum(count);
      elTotal.textContent = 'از ' + toFaNum(TARGET);
      btnUndo.disabled = count <= 0;
    }

    function pulseBtn(){
      btnCount.classList.remove('pulse');
      void btnCount.offsetWidth;
      btnCount.classList.add('pulse');
    }

    function addCount(n){
      const wasComplete = count >= TARGET;
      count = Math.min(count + n, TARGET);
      saveCount(currentKey, count);
      updateRing();
      pulseBtn();
      if(navigator.vibrate) try{ navigator.vibrate(count >= TARGET ? 60 : 12); }catch(e){}
      if(count >= TARGET && !wasComplete){
        showToast('ذکر امروز شما کامل شد؛ خدا قبول کند 🌙');
        renderStreak();
      }
      renderDayProgress();
    }

    function renderDay(force){
      const p = getTehranParts(new Date());
      const dayIndex = weekdayMap[p.weekday];
      if(!force && dayIndex === currentDayIndex){ return; }
      currentDayIndex = dayIndex;
      const today = ZEKR_BY_DAY[dayIndex] || ZEKR_BY_DAY[6];
      elDay.textContent = today.day;
      elPhrase.textContent = today.text;
      elPhraseFa.textContent = today.fa;
      currentKey = todayKey();
      count = loadCount(currentKey);
      updateRing();
      renderDayProgress();
      renderStreak();
    }

    btnCount.addEventListener('click', () => { if(count < TARGET) addCount(1); });
    btnPlus10.addEventListener('click', () => addCount(10));

    btnUndo.addEventListener('click', () => {
      if(count <= 0) return;
      count -= 1;
      saveCount(currentKey, count);
      updateRing();
      renderDayProgress();
    });

    btnReset.addEventListener('click', () => {
      count = 0;
      saveCount(currentKey, count);
      updateRing();
      showToast('شمارشگر ذکر از نو شروع شد');
      renderDayProgress();
      renderStreak();
    });

    // ---------------- رکورد روزهای متوالی ----------------
    function renderStreak(){
      const elCur = document.getElementById('streak-current');
      const elBest = document.getElementById('streak-best');
      if(!elCur || !elBest) return;

      // اگر ذکر امروز هنوز کامل نشده، از دیروز شمارش می‌کنیم (امروز هنوز "شکسته" نشده)
      let offset = (count >= TARGET) ? 0 : 1;
      let streak = 0;
      while(true){
        const c = loadCount(keyForOffset(offset));
        if(c >= TARGET){ streak++; offset++; } else break;
        if(offset > 3650) break; // محافظتی در برابر حلقه بی‌نهایت
      }
      const best = Math.max(streak, loadBestStreak());
      saveBestStreak(best);
      elCur.textContent = toFaNum(streak);
      elBest.textContent = toFaNum(best);
    }

    // ---------------- نوار پیشرفت روز (بر اساس ساعت واقعی تهران) ----------------
    const elDPFill = document.getElementById('zekr-day-progress-fill');
    const elDPLabel = document.getElementById('zekr-day-progress-label');
    function renderDayProgress(){
      if(!elDPFill || !elDPLabel) return;
      const now = new Date();
      const p = getTehranParts(now);
      const secOfDay = parseInt(p.hour,10)*3600 + parseInt(p.minute,10)*60 + parseInt(p.second,10);
      const remainingSec = 86400 - secOfDay;
      const ratio = Math.min(Math.max(secOfDay / 86400, 0), 1);
      const isDone = count >= TARGET;
      const hoursLeft = Math.floor(remainingSec / 3600);
      const minsLeft = Math.floor((remainingSec % 3600) / 60);

      elDPFill.style.width = (ratio * 100).toFixed(2) + '%';
      elDPFill.classList.toggle('complete', isDone);
      elDPFill.classList.toggle('urgent', !isDone && remainingSec <= 2 * 3600);
      elDPLabel.classList.toggle('complete', isDone);
      elDPLabel.classList.toggle('urgent', !isDone && remainingSec <= 2 * 3600);

      if(isDone){
        elDPLabel.textContent = 'ذکر امروز شما تکمیل شد';
      } else {
        const timeStr = toFaNum(hoursLeft) + ':' + toFaNum(String(minsLeft).padStart(2,'0'));
        const prefix = remainingSec <= 2 * 3600 ? 'وقت کمی تا پایان امروز مانده — ' : '';
        elDPLabel.textContent = prefix + timeStr + ' تا پایان امروز';
      }
    }

    renderDay(true);
    setInterval(() => renderDay(false), 5 * 60 * 1000);
    setInterval(renderDayProgress, 60 * 1000);
  })();

  // ---------------- انتقال نرم به صفحه اول ----------------
  (function backSmoothNav(){
    const trigger = document.getElementById('zekr-page-back');
    if(!trigger) return;
    const targetHref = trigger.getAttribute('href');
    /* لینک بازگشت الان یک لینک عادی است و بی‌درنگ باز می‌شود؛ پیش‌بارگذاری
       بالا هنوز فعال است تا صفحه اول سریع‌تر لود شود، اما دیگر منتظر
       انیمیشن محو شدن نمی‌مانیم که باعث لگ می‌شد. */
  })();

  // ذرات ریز طلایی پس‌زمینه (امبر)
  (function embers(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    const wrap = document.getElementById('embers');
    if(!wrap) return;
    const count = 8;
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'ember-spark';
      const left = Math.random()*100;
      const delay = Math.random()*10;
      const dur = 6 + Math.random()*6;
      const drift = (Math.random()*60 - 30) + 'px';
      s.style.left = left + 'vw';
      s.style.animationDelay = delay + 's';
      s.style.animationDuration = dur + 's';
      s.style.setProperty('--drift', drift);
      wrap.appendChild(s);
    }
  })();
</script>

<script>
  // ---------------- تغییر و همگام‌سازی تم با صفحه اول ----------------
  (function themeSwitcher(){
    const toggle = document.getElementById('theme-toggle');
    const popover = document.getElementById('theme-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.theme-opt');
    document.body.appendChild(popover);
    const THEME_CLASSES = ['theme-light', 'theme-dark', 'theme-fest', 'theme-crimson', 'theme-lilac', 'theme-sunset', 'theme-amber', 'theme-sky'];
    function applyTheme(theme){
      document.body.classList.remove(...THEME_CLASSES);
      if(THEME_CLASSES.includes('theme-' + theme)) document.body.classList.add('theme-' + theme);
      opts.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      try{ localStorage.setItem('kazemiuon-theme', theme); }catch(e){}
    }
    let saved = 'default';
    try{ saved = localStorage.getItem('kazemiuon-theme') || 'default'; }catch(e){}
    applyTheme(saved);
    function positionThemePopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 132;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const top = rect.top - popover.offsetHeight - 8;
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionThemePopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionThemePopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        applyTheme(b.dataset.theme);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- باز/بسته شدن منوی همبرگری ----------------
  (function quickMenu(){
    const btn = document.getElementById('quick-menu-btn');
    const panel = document.getElementById('quick-menu-panel');
    if(!btn || !panel) return;
    function closePanel(){
      panel.classList.remove('show');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const themePop = document.getElementById('theme-popover');
      const langPop = document.getElementById('lang-popover');
      if(themePop) themePop.classList.remove('show');
      if(langPop) langPop.classList.remove('show');
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      btn.classList.toggle('active', show);
      btn.setAttribute('aria-expanded', String(show));
    });
    document.addEventListener('click', (e) => {
      if(!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
        closePanel();
      }
    });
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closePanel();
    });
  })();

  // ---------------- ترجمه‌ها ----------------
  const translations = {
    fa: {
      backBtn: 'بازگشت',
      pageTitle: '📿 ذکر روز',
      streakCurrent: 'روز متوالی',
      streakBest: 'بهترین رکورد',
      quickMenuTheme: 'تم',
      quickMenuLang: 'زبان',
      quickMenuSound: 'صدا',
      quickMenuInstall: 'نصب اپ'
    },
    ar: {
      backBtn: 'رجوع',
      pageTitle: '📿 ذكر اليوم',
      streakCurrent: 'يوم متتالٍ',
      streakBest: 'أفضل رقم قياسي',
      quickMenuTheme: 'المظهر',
      quickMenuLang: 'اللغة',
      quickMenuSound: 'الصوت',
      quickMenuInstall: 'تثبيت التطبيق'
    },
    en: {
      backBtn: 'Back',
      pageTitle: '📿 Daily Dhikr',
      streakCurrent: 'Day streak',
      streakBest: 'Best streak',
      quickMenuTheme: 'Theme',
      quickMenuLang: 'Language',
      quickMenuSound: 'Sound',
      quickMenuInstall: 'Install App'
    }
  };

  let currentLang = 'fa';

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[lang][key] !== undefined){
        el.textContent = translations[lang][key];
      }
    });
    const activeOpt = document.querySelector('.lang-opt[data-lang="' + lang + '"]');
    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if(activeOpt){
      const flagEl = document.getElementById('lang-toggle-flag');
      const codeEl = document.getElementById('lang-toggle-code');
      if(flagEl) flagEl.textContent = activeOpt.dataset.flag;
      if(codeEl) codeEl.textContent = activeOpt.dataset.code;
    }
  }

  // ---------------- تغییر زبان ----------------
  (function langSwitcher(){
    const toggle = document.getElementById('lang-toggle');
    const popover = document.getElementById('lang-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.lang-opt');
    document.body.appendChild(popover);
    function positionLangPopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 150;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const ph = popover.offsetHeight || 140;
      let top = rect.bottom + 8;
      if(top + ph > window.innerHeight - margin){
        top = rect.top - ph - 8;
      }
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionLangPopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionLangPopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        setLang(b.dataset.lang);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- دکمه صدا (افکت تیک کلیک) ----------------
  (function soundToggle(){
    const soundState = { muted: true, ctx: null };
    function ensureAudioCtx(){
      if(!soundState.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) soundState.ctx = new AC();
      }
      return soundState.ctx;
    }
    function playTick(){
      if(soundState.muted) return;
      const ctx = ensureAudioCtx();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime;
      osc.frequency.setValueAtTime(720, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.16);
    }
    document.querySelectorAll('.lang-opt, .lang-toggle, .theme-opt').forEach(el => {
      el.addEventListener('click', playTick);
    });
    const btn = document.getElementById('sound-toggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      soundState.muted = !soundState.muted;
      btn.setAttribute('aria-pressed', String(!soundState.muted));
      btn.querySelector('.icon-sound-on').style.display = soundState.muted ? 'none' : 'block';
      btn.querySelector('.icon-sound-off').style.display = soundState.muted ? 'block' : 'none';
      if(!soundState.muted){ ensureAudioCtx(); playTick(); }
    });
  })();
</script>

  (function pwaInstall(){
    let deferredPrompt = null;
    const row = document.getElementById('pwa-install-row');
    const btn = document.getElementById('pwa-install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if(row) row.style.display = '';
    });
    if(btn){
      btn.addEventListener('click', async () => {
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(row) row.style.display = 'none';
      });
    }
    window.addEventListener('appinstalled', () => {
      if(row) row.style.display = 'none';
    });
  })();
</script>

    var DIGITS = { fa:['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'], ar:['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'] };

    /* ----- متن‌ها ----- */

    function showSize(){ var v = $('#kzm-size-val'); if(v) v.textContent = nf(sizePct) + (lang() === 'en' ? '%' : '٪'); }

      var l = lang(), d = D[l];
      $$('#kzm-menu-btn [data-k], #kzm-menu [data-k]').forEach(function(el){ var v = d[el.getAttribute('data-k')]; if(v !== undefined) el.textContent = v; });
      $$('#kzm-menu-btn [data-k-aria], #kzm-menu [data-k-aria]').forEach(function(el){ var v = d[el.getAttribute('data-k-aria')]; if(v !== undefined) el.setAttribute('aria-label', v); });
      $$('.kzm-langs button').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-lang') === l)); });
      $$('.kzm-themes button').forEach(function(b){ var t = TH[b.getAttribute('data-theme')]; var n = b.querySelector('.n'); if(t && n) n.textContent = t[l]; });
      showSize();
    }

    /* ----- باز و بسته شدن ----- */
    function syncAll(){ syncTheme(); syncSound(); syncInstall(); }
    function setOpen(on){
      overlay.classList.toggle('open', on);
      btn.setAttribute('aria-expanded', String(on));
      document.body.style.overflow = on ? 'hidden' : '';
      if(on){ syncAll(); var f = panel.querySelector('.kzm-langs button[aria-checked="true"]') || closeBtn; if(f) f.focus({ preventScroll:true }); }
    }
    btn.addEventListener('click', function(){ setOpen(true); });
    closeBtn.addEventListener('click', function(){ setOpen(false); btn.focus({ preventScroll:true }); });
    overlay.addEventListener('click', function(e){ if(e.target === overlay) setOpen(false); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('open')){ setOpen(false); btn.focus({ preventScroll:true }); } });

    /* ----- زبان ----- */
    var userLang = false;
    var hasLang = !!$('#lang-popover .lang-opt');
    if(!hasLang){ var cl = $('#kzm-card-lang'); if(cl) cl.remove(); }
    $$('.kzm-langs button').forEach(function(b){
      b.addEventListener('click', function(){
        var l = b.getAttribute('data-lang'); userLang = true;
        click('#lang-popover .lang-opt[data-lang="' + l + '"]');
        LS.set('kazemiuon-lang', l); paint();
      });
    });
    function restoreLang(){
      var s = LS.get('kazemiuon-lang');
      if(hasLang && !userLang && s && D[s] && s !== lang()) click('#lang-popover .lang-opt[data-lang="' + s + '"]');
    }
    try{
      new MutationObserver(function(){ paint(); }).observe(root, { attributes:true, attributeFilter:['lang'] });
    }catch(e){}

    /* ----- تم ----- */
    var hasTheme = !!$('#theme-popover .theme-opt');
    if(!hasTheme){ var ct = $('#kzm-card-theme'); if(ct) ct.remove(); }
    function syncTheme(){
      var a = $('#theme-popover .theme-opt.active'); var cur = a ? a.getAttribute('data-theme') : 'default';
      $$('.kzm-themes button').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-theme') === cur)); });
    }
    $$('.kzm-themes button').forEach(function(b){
      b.addEventListener('click', function(){ click('#theme-popover .theme-opt[data-theme="' + b.getAttribute('data-theme') + '"]'); setTimeout(syncTheme, 0); syncTheme(); });
    });

    /* ----- اندازه‌ی متن ----- */
    var range = $('#kzm-size'), MIN = 70, MAX = 170;
    var legacyUp = $('#font-size-up'), legacyDown = $('#font-size-down');   /* صفحه‌ی هیئت: بزرگ‌نمایی کل بدنه */
    if(legacyUp && legacyDown) root.classList.add('kzm-bodyzoom');
    function drawRange(){
      if(range){ range.value = sizePct; range.style.setProperty('--p', ((sizePct - MIN) / (MAX - MIN) * 100) + '%'); }
      showSize();
    }
    function applySize(){
      sizePct = Math.max(MIN, Math.min(MAX, Math.round(sizePct / 10) * 10));
      if(legacyUp && legacyDown){
        var cur = parseInt(LS.get('kazemiuon-font-size'), 10) || 100, guard = 0;
        while(cur !== sizePct && guard++ < 12){
          var b = cur < sizePct ? legacyUp : legacyDown;
          if(b.disabled) break; b.click(); cur += (cur < sizePct ? 10 : -10);
        }
        root.style.setProperty('--kzm-inv', String(100 / sizePct));
      }else{
        root.style.setProperty('--kzm-zoom', String(sizePct / 100));
        LS.set('kazemiuon-font-size', String(sizePct));
      }
      drawRange();
    }
    sizePct = parseInt(LS.get('kazemiuon-font-size'), 10) || 100;
    if(range) range.addEventListener('input', function(){ sizePct = parseInt(range.value, 10) || 100; applySize(); });
    if(legacyUp && legacyDown){ sizePct = Math.max(MIN, Math.min(MAX, sizePct)); root.style.setProperty('--kzm-inv', String(100 / sizePct)); drawRange(); }
    else applySize();

    /* ----- صدا ----- */
    var sw = $('#kzm-sound'), legacySound = $('#sound-toggle');
    if(!legacySound){ var cs = $('#kzm-card-sound'); if(cs) cs.remove(); }
    function soundOn(){ return !!legacySound && legacySound.getAttribute('aria-pressed') === 'true'; }
    function syncSound(){ if(sw) sw.setAttribute('aria-checked', String(soundOn())); }
    if(sw && legacySound) sw.addEventListener('click', function(){
      legacySound.click(); syncSound(); LS.set('kazemiuon-sound', soundOn() ? '1' : '0');
    });
    (function(){
      var s = LS.get('kazemiuon-sound');
      if(legacySound && (s === '1' || s === '0') && (s === '1') !== soundOn()) legacySound.click();
      syncSound();
    })();

    /* ----- نصب اپلیکیشن ----- */
    var row = $('#pwa-install-row'), inst = $('#kzm-install');
    function syncInstall(){ if(inst) inst.hidden = !(row && getComputedStyle(row).display !== 'none'); }
    if(inst){
      inst.addEventListener('click', function(){ setOpen(false); click('#pwa-install-btn'); });
      if(row){ try{ new MutationObserver(syncInstall).observe(row, { attributes:true, attributeFilter:['style'] }); }catch(e){} }
      syncInstall();
    }

    /* ----- مرکز دانلود (فقط صفحه‌ی هیئت) ----- */
    var dl = $('#kzm-downloads');
    if(dl){
      if($('#downloads-trigger')){ dl.hidden = false; dl.addEventListener('click', function(){ setOpen(false); setTimeout(function(){ click('#downloads-trigger'); }, 60); }); }
      else dl.remove();
    }

    paint();
    restoreLang();
    window.addEventListener('load', function(){ setTimeout(function(){ restoreLang(); paint(); }, 0); });
  }catch(e){}
})();
</script>
</body>
</html>
