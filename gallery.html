<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  // دکمه بازگشت گوشی: اگر صفحه مستقیم (بدون سابقه مرورگر) باز شده باشد،
  // به‌جای نمایش خطا، کاربر را به صفحه اول هیئت برمی‌گرداند
  (function(){
    try{
      history.pushState({kazemiyoonBackTrap:true}, '', location.href);
      window.addEventListener('popstate', function(){
        location.replace('index.html');
      });
    }catch(err){}
  })();
</script>

<title>🖼️ گالری تصاویر | هیئت کاظمیون خرم‌آباد</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e9b62">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --void:#071710;
    --void-2:#0e2419;
    --crimson:#0e9b62;
    --crimson-rgb:14,155,98;
    --crimson-bright:#22c17f;
    --gold:#ffcb3d;
    --gold-soft:#d1a52a;
    --gold-dim:#8a6e1e;
    --parchment:#f3ead0;
    --parchment-dim:#a99b78;
    --line:rgba(255,203,61,0.22);
    --ember:#ffd166;
    --ember-soft:#ffd16666;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgba(var(--crimson-rgb),0.30), transparent 55%),
      radial-gradient(ellipse 90% 50% at 15% 40%, rgba(var(--crimson-rgb),0.10), transparent 60%),
      radial-gradient(ellipse 90% 50% at 85% 75%, rgba(var(--crimson-rgb),0.12), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    animation:page2FadeIn 0.4s ease;
    transition:opacity 0.28s ease, transform 0.28s ease;
  }
  @keyframes page2FadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  body.page-exit{ opacity:0; transform:translateY(-8px); }

  /* ---------------- ذرات ریز طلایی پس‌زمینه ---------------- */
  .embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ember-spark{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 6px 1px var(--ember-soft);
    opacity:0;
    animation-name:rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.9; }
    80%{ opacity:0.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember-spark{ display:none; }
  }
  .page{
    width:100%;
    max-width:500px;
    padding:0 22px 60px;
    position:relative;
    z-index:1;
  }

  /* ============================================================
     THEME SYSTEM (پیش‌فرض: طلایی‌وزمردی / سرخ‌وطلایی /
     صورتی‌وفیروزه‌ای / صورتی‌ویاسی / فیروزه‌ای‌وغروبی /
     کهربایی‌وکرمی / آبی‌آسمانی / سبز فسفری / تاریک)
     همان تعریف رنگ‌های index.html تا در دو صفحه هماهنگ بماند
  ============================================================ */
  body.theme-dark{
    --void:#000000; --void-2:#0a0a0a;
    --crimson:#6e1013; --crimson-bright:#9c2320;
    --gold:#a3853a; --gold-soft:#6f5d33; --gold-dim:#453a22;
    --parchment:#d8d0bf; --parchment-dim:#83786a;
    --line:rgba(163,133,58,0.14);
    background:#000000;
  }
  body.theme-light{
    --void:#04120a; --void-2:#071c11;
    --crimson:#39ff14; --crimson-rgb:57,255,20; --crimson-bright:#7dffb0;
    --gold:#b6ff2e; --gold-soft:#7fd11a; --gold-dim:#4a7a1e;
    --parchment:#e9ffee; --parchment-dim:#8fc79f;
    --line:rgba(57,255,20,0.28);
  }
  body.theme-fest{
    --void:#0c1220; --void-2:#121a2e;
    --crimson:#d81b60; --crimson-rgb:216,27,96; --crimson-bright:#ff4081;
    --gold:#ffca28; --gold-soft:#e0a72a; --gold-dim:#b8860b;
    --parchment:#fff6e0; --parchment-dim:#d8c9a3;
    --line:rgba(255,202,40,0.25);
  }
  body.theme-crimson{
    --void:#0e0906; --void-2:#150e0a;
    --crimson:#8c1518; --crimson-rgb:140,21,24; --crimson-bright:#b8241f;
    --gold:#c9a227; --gold-soft:#8a7040; --gold-dim:#5c4a28;
    --parchment:#f1e7d8; --parchment-dim:#a99c8a;
    --line:rgba(201,162,39,0.16);
  }
  body.theme-lilac{
    --void:#160a1e; --void-2:#1f1029;
    --crimson:#c65bd6; --crimson-rgb:198,91,214; --crimson-bright:#e28ae8;
    --gold:#f0c94e; --gold-soft:#caa53a; --gold-dim:#8a6f28;
    --parchment:#fbeefc; --parchment-dim:#c3a8c9;
    --line:rgba(240,201,78,0.22);
  }
  body.theme-sunset{
    --void:#071c22; --void-2:#0d2a32;
    --crimson:#ff7a45; --crimson-rgb:255,122,69; --crimson-bright:#ff9d6e;
    --gold:#ffcf6b; --gold-soft:#dba63e; --gold-dim:#8f6c22;
    --parchment:#fff3e6; --parchment-dim:#c8b39c;
    --line:rgba(32,196,196,0.25);
  }
  body.theme-amber{
    --void:#1c130a; --void-2:#241a0e;
    --crimson:#c8752b; --crimson-rgb:200,117,43; --crimson-bright:#e29344;
    --gold:#f0c14b; --gold-soft:#cb9f33; --gold-dim:#836a20;
    --parchment:#fbf1dc; --parchment-dim:#c9b998;
    --line:rgba(240,193,75,0.22);
  }
  body.theme-sky{
    --void:#081521; --void-2:#0e2032;
    --crimson:#2f8ce0; --crimson-rgb:47,140,224; --crimson-bright:#5fadf5;
    --gold:#ffd35c; --gold-soft:#d9ac3c; --gold-dim:#8f7126;
    --parchment:#f0f8ff; --parchment-dim:#a9c2d6;
    --line:rgba(127,212,255,0.22);
  }

  /* ---------------- منوی سریع (همبرگری: تم) ---------------- */
  .quick-menu{
    position:fixed;
    top:14px; left:14px;
    z-index:65;
  }
  .quick-menu-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.75);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .quick-menu-btn svg{ width:17px; height:17px; }
  .quick-menu-btn:hover, .quick-menu-btn.active{ border-color:var(--gold-soft); color:var(--gold); }
  .quick-menu-panel{
    position:absolute;
    top:44px; left:0;
    display:flex; flex-direction:column;
    align-items:stretch;
    gap:8px;
    min-width:168px;
    padding:12px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index:65;
  }
  .quick-menu-panel.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .quick-menu-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .quick-menu-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
  }
  .theme-switch-wrap{ position:relative; }
  .theme-toggle-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .theme-toggle-btn svg{ width:15px; height:15px; }
  .theme-toggle-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .theme-popover{
    position:fixed;
    width:max-content;
    max-width:min(260px, calc(100vw - 20px));
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:row; flex-wrap:wrap;
    gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-6px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .theme-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .theme-opt{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 9px; border-radius:9px; cursor:pointer; text-align:center;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .theme-opt.active{ color:var(--void); background:var(--gold); }
  .theme-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .lang-switch-wrap{ position:relative; }
  .lang-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .lang-toggle:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .lang-toggle .lang-flag{ font-size:14px; line-height:1; }
  .lang-popover{
    position:fixed;
    transform:translateY(-6px);
    min-width:150px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:column; gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .lang-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-opt{
    display:flex; align-items:center; gap:8px;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 10px; border-radius:9px; cursor:pointer; text-align:right;
    transition:all 0.15s ease;
  }
  .lang-opt .lang-flag{ font-size:15px; line-height:1; flex:none; }
  .lang-opt.active{ color:var(--void); background:var(--gold); }
  .lang-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .sound-toggle{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .sound-toggle svg{ width:15px; height:15px; }
  .sound-toggle:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ---------------- header ---------------- */
  .page2-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:20px 0 8px;
  }
  .page2-back{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:linear-gradient(135deg, var(--gold-bright, var(--gold)), var(--crimson-bright));
    background-size:200% 200%;
    color:#1a0f04;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.02em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12);
    transition:all 0.2s ease, transform 0.25s ease;
    animation:page2Pulse 2.6s ease-in-out infinite, page2Shine 5s linear infinite;
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:60;
    overflow:hidden;
  }
  .page2-back::after{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:page2Sweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes page2Sweep{
    0%{ left:-60%; }
    38%{ left:130%; }
    100%{ left:130%; }
  }
  .page2-back svg{ width:16px; height:16px; flex:none; }
  .page2-back:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 2px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(var(--crimson-rgb),0.55), 0 0 0 5px rgba(var(--crimson-rgb),0.18); }
  .page2-back:active{ transform:scale(0.94); }
  @keyframes page2Pulse{
    0%,100%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12); }
    50%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 26px rgba(var(--crimson-rgb),0.65), 0 0 0 8px rgba(var(--crimson-rgb),0.05); }
  }
  @keyframes page2Shine{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .page2-header-title{
    flex:1;
    min-width:0;
    text-align:center;
    font-size:15px;
    font-weight:700;
    color:var(--parchment);
    overflow-wrap:break-word;
  }

  /* ---------------- logo mini ---------------- */
  .mini-logo-wrap{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .mini-logo{
    width:64px; height:64px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------------- group label ---------------- */
  .group-label{
    font-size:12px;
    color:var(--gold-soft);
    letter-spacing:0.1em;
    margin:26px 4px 14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .group-label.group-label-lg{
    font-size:23px;
    color:var(--gold);
    letter-spacing:0.04em;
    font-weight:800;
  }

  /* ============================================================
     گالری تصاویر
  ============================================================ */
  .gallery-intro{
    font-size:12.5px;
    color:var(--parchment-dim);
    line-height:1.9;
    text-align:center;
    margin:2px 0 18px;
  }
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .gallery-item{
    position:relative;
    display:block;
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:1 / 1;
    border:1px solid var(--line);
    background:var(--void-2, var(--void));
    cursor:pointer;
    padding:0;
    -webkit-appearance:none;
    appearance:none;
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .gallery-item:hover{ transform:translateY(-2px); border-color:var(--gold-soft); }
  .gallery-item:active{ transform:scale(0.97); }
  .gallery-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.35s ease;
  }
  .gallery-item:hover img{ transform:scale(1.06); }
  .gallery-item.wide{ grid-column:span 2; aspect-ratio:2 / 1.15; }
  .gallery-item-cap{
    position:absolute;
    inset:auto 0 0 0;
    padding:16px 10px 8px;
    background:linear-gradient(to top, rgba(0,0,0,0.72), transparent);
    color:#fff;
    font-size:11px;
    font-weight:700;
    text-align:center;
    line-height:1.5;
  }
  .gallery-item-download{
    position:absolute;
    top:8px; inset-inline-end:8px;
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(10,7,4,0.62);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    transition:all 0.18s ease;
    z-index:2;
  }
  .gallery-item-download svg{ width:14px; height:14px; }
  .gallery-item-download:hover{ border-color:var(--gold-soft); color:var(--gold); background:rgba(10,7,4,0.85); }
  .gallery-item-download:active{ transform:scale(0.9); }
  .gallery-item-download{ animation:iconGlow 3.2s ease-in-out infinite; }
  @keyframes iconGlow{
    0%,100%{ box-shadow:0 0 5px 0 rgba(255,203,61,0.18); }
    50%{ box-shadow:0 0 13px 3px rgba(255,203,61,0.5); }
  }

  /* ---------------- لایت‌باکس تصویر ---------------- */
  .lightbox-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,3,2,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 18px;
    z-index:120;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.25s ease, visibility 0.25s ease;
  }
  .lightbox-overlay.show{ opacity:1; visibility:visible; }
  .lightbox-fig{
    position:relative;
    max-width:min(520px, 100%);
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    transform:scale(0.94);
    transition:transform 0.25s ease;
  }
  .lightbox-overlay.show .lightbox-fig{ transform:scale(1); }
  .lightbox-fig img{
    max-width:100%;
    max-height:70vh;
    border-radius:14px;
    border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,0.55);
  }
  .lightbox-cap{
    font-size:12.5px;
    font-weight:700;
    color:var(--parchment);
    text-align:center;
  }
  .lightbox-toolbar{
    position:absolute;
    top:-46px; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .lightbox-close,
  .lightbox-download{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.8);
    color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .lightbox-close svg,
  .lightbox-download svg{ width:16px; height:16px; }
  .lightbox-close:hover,
  .lightbox-download:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ---------------- نوار دانلود ---------------- */
  .download-bar{
    position:fixed;
    left:50%;
    bottom:calc(26px + 54px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%) translateY(20px);
    width:min(360px, calc(100vw - 32px));
    background:rgba(20,14,10,0.96);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;

<script>
  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, successMsg){
    try{
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast(successMsg); }catch(e2){}
      document.body.removeChild(ta);
    }
  }

  // ---------------- دانلود تصویر با نوار پیشرفت و لغو ----------------
  let activeDownloadController = null;
  let downloadSession = 0;

  async function downloadImage(url, filename){
    if(activeDownloadController){
      activeDownloadController.abort();
    }
    const controller = new AbortController();
    activeDownloadController = controller;
    const mySession = ++downloadSession;

    const bar = document.getElementById('download-bar');
    const nameEl = document.getElementById('download-bar-name');
    const percentEl = document.getElementById('download-bar-percent');
    const fillEl = document.getElementById('download-bar-fill');
    const cancelBtn = document.getElementById('download-bar-cancel');

    bar.dataset.session = String(mySession);
    nameEl.textContent = filename;
    percentEl.textContent = '0%';
    fillEl.style.width = '0%';
    bar.classList.add('show');

    function onCancelClick(){ controller.abort(); }
    cancelBtn.addEventListener('click', onCancelClick);

    try{
      const response = await fetch(url, { signal: controller.signal });
      if(!response.ok || !response.body) throw new Error('bad-response');
      const total = Number(response.headers.get('content-length')) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;
        if(total){
          const pct = Math.min(100, Math.round((received / total) * 100));
          fillEl.style.width = pct + '%';
          percentEl.textContent = pct + '%';
        } else {
          percentEl.textContent = Math.round(received / 1024) + 'KB';
        }
      }
      const blob = new Blob(chunks);
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
      fillEl.style.width = '100%';
      percentEl.textContent = '100%';
      showToast('دانلود تصویر با موفقیت انجام شد');
    }catch(err){
      if(err.name === 'AbortError'){
        showToast('دانلود لغو شد');
      } else {
        showToast('خطا در دانلود تصویر');
      }
    }finally{
      cancelBtn.removeEventListener('click', onCancelClick);
      if(activeDownloadController === controller) activeDownloadController = null;
      setTimeout(() => {
        // only hide if no newer download has started in the meantime
        if(bar.dataset.session === String(mySession)) bar.classList.remove('show');
      }, 900);
    }
  }

  // ---------------- لایت‌باکس گالری ----------------
  (function gallery(){
    const grid = document.getElementById('gallery-grid');
    const overlay = document.getElementById('lightbox-overlay');
    const imgEl = document.getElementById('lightbox-img');
    const capEl = document.getElementById('lightbox-cap');
    const closeBtn = document.getElementById('lightbox-close');
    const lightboxDownloadBtn = document.getElementById('lightbox-download');
    if(!grid || !overlay || !imgEl) return;

    let currentFull = '';
    let currentFilename = 'image.jpg';

    function openLightbox(item){
      currentFull = item.dataset.full || item.querySelector('img').src;
      currentFilename = item.dataset.filename || (currentFull.split('/').pop() || 'image.jpg');
      imgEl.src = currentFull;
      imgEl.alt = item.dataset.caption || '';
      capEl.textContent = item.dataset.caption || '';
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(){
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    grid.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => openLightbox(item));
      item.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          openLightbox(item);
        }
      });
    });

    grid.querySelectorAll('.gallery-item-download').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const full = btn.dataset.full;
        const filename = btn.dataset.filename || (full.split('/').pop() || 'image.jpg');
        downloadImage(full, filename);
      });
    });

    if(lightboxDownloadBtn){
      lightboxDownloadBtn.addEventListener('click', () => {
        if(currentFull) downloadImage(currentFull, currentFilename);
      });
    }

    closeBtn.addEventListener('click', closeLightbox);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });
  })();

  // ---------------- تغییر و همگام‌سازی تم با صفحه اول ----------------
  (function themeSwitcher(){
    const toggle = document.getElementById('theme-toggle');
    const popover = document.getElementById('theme-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.theme-opt');

    document.body.appendChild(popover);

    const THEME_CLASSES = ['theme-light', 'theme-dark', 'theme-fest', 'theme-crimson', 'theme-lilac', 'theme-sunset', 'theme-amber', 'theme-sky'];
    function applyTheme(theme){
      document.body.classList.remove(...THEME_CLASSES);
      if(THEME_CLASSES.includes('theme-' + theme)) document.body.classList.add('theme-' + theme);
      opts.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      try{ localStorage.setItem('kazemiuon-theme', theme); }catch(e){}
    }

    let saved = 'default';
    try{ saved = localStorage.getItem('kazemiuon-theme') || 'default'; }catch(e){}
    applyTheme(saved);

    function positionThemePopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 132;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const top = rect.top - popover.offsetHeight - 8;
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionThemePopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionThemePopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        applyTheme(b.dataset.theme);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- باز/بسته شدن منوی همبرگری ----------------
  (function quickMenu(){
    const btn = document.getElementById('quick-menu-btn');
    const panel = document.getElementById('quick-menu-panel');
    if(!btn || !panel) return;

    function closePanel(){
      panel.classList.remove('show');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const themePop = document.getElementById('theme-popover');
      const langPop = document.getElementById('lang-popover');
      if(themePop) themePop.classList.remove('show');
      if(langPop) langPop.classList.remove('show');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      btn.classList.toggle('active', show);
      btn.setAttribute('aria-expanded', String(show));
    });

    document.addEventListener('click', (e) => {
      if(!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
        closePanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closePanel();
    });
  })();

  let currentLang = 'fa';

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[lang][key] !== undefined){
        el.textContent = translations[lang][key];
      }
    });
    const activeOpt = document.querySelector('.lang-opt[data-lang="' + lang + '"]');
    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if(activeOpt){
      const flagEl = document.getElementById('lang-toggle-flag');
      const codeEl = document.getElementById('lang-toggle-code');
      if(flagEl) flagEl.textContent = activeOpt.dataset.flag;
      if(codeEl) codeEl.textContent = activeOpt.dataset.code;
    }
  }

  // ---------------- تغییر زبان ----------------
  (function langSwitcher(){
    const toggle = document.getElementById('lang-toggle');
    const popover = document.getElementById('lang-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.lang-opt');

    document.body.appendChild(popover);

    function positionLangPopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 150;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const ph = popover.offsetHeight || 140;
      let top = rect.bottom + 8;
      if(top + ph > window.innerHeight - margin){
        top = rect.top - ph - 8;
      }
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionLangPopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionLangPopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        setLang(b.dataset.lang);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- دکمه صدا (افکت تیک کلیک) ----------------
  (function soundToggle(){
    const soundState = { muted: true, ctx: null };
    function ensureAudioCtx(){
      if(!soundState.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) soundState.ctx = new AC();
      }
      return soundState.ctx;
    }
    function playTick(){
      if(soundState.muted) return;
      const ctx = ensureAudioCtx();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime;
      osc.frequency.setValueAtTime(720, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.16);
    }
    document.querySelectorAll('.lang-opt, .lang-toggle, .theme-opt, .copy-btn').forEach(el => {
      el.addEventListener('click', playTick);
    });
    const btn = document.getElementById('sound-toggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      soundState.muted = !soundState.muted;
      btn.setAttribute('aria-pressed', String(!soundState.muted));
      btn.querySelector('.icon-sound-on').style.display = soundState.muted ? 'none' : 'block';
      btn.querySelector('.icon-sound-off').style.display = soundState.muted ? 'block' : 'none';
      if(!soundState.muted){ ensureAudioCtx(); playTick(); }
    });
  })();

  // ---------------- انتقال نرم به صفحه اول (پیش‌بارگذاری + بدون پرش) ----------------
  (function backSmoothNav(){
    const trigger = document.getElementById('page2-back');
    if(!trigger) return;
    const targetHref = trigger.getAttribute('href');

    function prefetchTarget(){
      if(document.getElementById('page2-prefetch-link')) return;
      const link = document.createElement('link');
      link.id = 'page2-prefetch-link';
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = targetHref;
      document.head.appendChild(link);
    }

    // وقتی کاربر با اسکرول به دکمه بازگشت نزدیک می‌شود، صفحه اول از قبل بارگذاری شود
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            prefetchTarget();
            io.disconnect();
          }
        });
      }, { root:null, rootMargin:'500px 0px', threshold:0 });
      io.observe(trigger);
    } else {
      prefetchTarget();
    }

    trigger.addEventListener('pointerenter', prefetchTarget, { once:true });
    trigger.addEventListener('touchstart', prefetchTarget, { once:true, passive:true });
    trigger.addEventListener('focus', prefetchTarget, { once:true });

    /* لینک بازگشت الان یک لینک عادی است و بی‌درنگ باز می‌شود؛ پیش‌بارگذاری
       بالا هنوز فعال است تا صفحه اول سریع‌تر لود شود، اما دیگر منتظر
       انیمیشن محو شدن نمی‌مانیم که باعث لگ می‌شد. */
  })();

  // ذرات ریز طلایی پس‌زمینه (امبر)
  (function embers(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    var wrap = document.getElementById('embers');
    if(!wrap) return;
    var count = 8;
    for(var i=0;i<count;i++){
      var s = document.createElement('div');
      s.className = 'ember-spark';
      var left = Math.random()*100;
      var delay = Math.random()*10;
      var dur = 6 + Math.random()*6;
      var drift = (Math.random()*60 - 30) + 'px';
      s.style.left = left + 'vw';
      s.style.animationDelay = delay + 's';
      s.style.animationDuration = dur + 's';
      s.style.setProperty('--drift', drift);
      wrap.appendChild(s);
    }
  })();
</script>


<script>

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });

  (function pwaInstall(){
    let deferredPrompt = null;
    const row = document.getElementById('pwa-install-row');
    const btn = document.getElementById('pwa-install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if(row) row.style.display = '';
    });
    if(btn){
      btn.addEventListener('click', async () => {
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(row) row.style.display = 'none';
      });
    }
    window.addEventListener('appinstalled', () => {
      if(row) row.style.display = 'none';
    });
  })();
</script>
