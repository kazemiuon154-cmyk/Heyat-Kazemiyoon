<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  // دکمه بازگشت گوشی: اگر صفحه مستقیم (بدون سابقه مرورگر) باز شده باشد،
  // به‌جای نمایش خطا، کاربر را به صفحه اول هیئت برمی‌گرداند
  (function(){
    try{
      history.pushState({kazemiyoonBackTrap:true}, '', location.href);
      window.addEventListener('popstate', function(){
        location.replace('index.html');
      });
    }catch(err){}
  })();
</script>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">

<title>❓ دستیار سایت | هیئت کاظمیون خرم‌آباد</title>
<meta name="description" content="پرسش و پاسخ سریع هیئت کاظمیون خرم‌آباد؛ کافیست روی سوال موردنظرت بزنی تا بلافاصله جواب رو ببینی.">
<meta name="robots" content="noindex, follow">

<style>
  :root{
    --void:#071710;
    --void-2:#0e2419;
    --crimson:#0e9b62;
    --crimson-rgb:14,155,98;
    --crimson-bright:#22c17f;
    --gold:#ffcb3d;
    --gold-soft:#d1a52a;
    --gold-dim:#8a6e1e;
    --parchment:#f3ead0;
    --parchment-dim:#a99b78;
    --line:rgba(255,203,61,0.22);
    --ember:#ffd166;
    --ember-soft:#ffd16666;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 120% 70% at 50% -8%, rgba(var(--crimson-rgb),0.30), transparent 55%),
      radial-gradient(ellipse 90% 50% at 15% 40%, rgba(var(--crimson-rgb),0.10), transparent 60%),
      radial-gradient(ellipse 90% 50% at 85% 75%, rgba(var(--crimson-rgb),0.12), transparent 60%),
      var(--void);
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    animation:page2FadeIn 0.4s ease;
    transition:opacity 0.28s ease, transform 0.28s ease;
  }
  @keyframes page2FadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  body.page-exit{ opacity:0; transform:translateY(-8px); }

  /* ---------------- ذرات ریز طلایی پس‌زمینه ---------------- */
  .embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ember-spark{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 6px 1px var(--ember-soft);
    opacity:0;
    animation-name:rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.9; }
    80%{ opacity:0.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember-spark{ display:none; }
  }
  .page{
    width:100%;
    max-width:500px;
    padding:0 22px 60px;
    position:relative;
    z-index:1;
  }

  /* ============================================================
     THEME SYSTEM (پیش‌فرض: طلایی‌وزمردی / سرخ‌وطلایی /
     صورتی‌وفیروزه‌ای / صورتی‌ویاسی / فیروزه‌ای‌وغروبی /
     کهربایی‌وکرمی / آبی‌آسمانی / سبز فسفری / تاریک)
     همان تعریف رنگ‌های index.html تا در دو صفحه هماهنگ بماند
  ============================================================ */
  body.theme-dark{
    --void:#000000; --void-2:#0a0a0a;
    --crimson:#6e1013; --crimson-bright:#9c2320;
    --gold:#a3853a; --gold-soft:#6f5d33; --gold-dim:#453a22;
    --parchment:#d8d0bf; --parchment-dim:#83786a;
    --line:rgba(163,133,58,0.14);
    background:#000000;
  }
  body.theme-light{
    --void:#04120a; --void-2:#071c11;
    --crimson:#39ff14; --crimson-rgb:57,255,20; --crimson-bright:#7dffb0;
    --gold:#b6ff2e; --gold-soft:#7fd11a; --gold-dim:#4a7a1e;
    --parchment:#e9ffee; --parchment-dim:#8fc79f;
    --line:rgba(57,255,20,0.28);
  }
  body.theme-fest{
    --void:#0c1220; --void-2:#121a2e;
    --crimson:#d81b60; --crimson-rgb:216,27,96; --crimson-bright:#ff4081;
    --gold:#ffca28; --gold-soft:#e0a72a; --gold-dim:#b8860b;
    --parchment:#fff6e0; --parchment-dim:#d8c9a3;
    --line:rgba(255,202,40,0.25);
  }
  body.theme-crimson{
    --void:#0e0906; --void-2:#150e0a;
    --crimson:#8c1518; --crimson-rgb:140,21,24; --crimson-bright:#b8241f;
    --gold:#c9a227; --gold-soft:#8a7040; --gold-dim:#5c4a28;
    --parchment:#f1e7d8; --parchment-dim:#a99c8a;
    --line:rgba(201,162,39,0.16);
  }
  body.theme-lilac{
    --void:#160a1e; --void-2:#1f1029;
    --crimson:#c65bd6; --crimson-rgb:198,91,214; --crimson-bright:#e28ae8;
    --gold:#f0c94e; --gold-soft:#caa53a; --gold-dim:#8a6f28;
    --parchment:#fbeefc; --parchment-dim:#c3a8c9;
    --line:rgba(240,201,78,0.22);
  }
  body.theme-sunset{
    --void:#071c22; --void-2:#0d2a32;
    --crimson:#ff7a45; --crimson-rgb:255,122,69; --crimson-bright:#ff9d6e;
    --gold:#ffcf6b; --gold-soft:#dba63e; --gold-dim:#8f6c22;
    --parchment:#fff3e6; --parchment-dim:#c8b39c;
    --line:rgba(32,196,196,0.25);
  }
  body.theme-amber{
    --void:#1c130a; --void-2:#241a0e;
    --crimson:#c8752b; --crimson-rgb:200,117,43; --crimson-bright:#e29344;
    --gold:#f0c14b; --gold-soft:#cb9f33; --gold-dim:#836a20;
    --parchment:#fbf1dc; --parchment-dim:#c9b998;
    --line:rgba(240,193,75,0.22);
  }
  body.theme-sky{
    --void:#081521; --void-2:#0e2032;
    --crimson:#2f8ce0; --crimson-rgb:47,140,224; --crimson-bright:#5fadf5;
    --gold:#ffd35c; --gold-soft:#d9ac3c; --gold-dim:#8f7126;
    --parchment:#f0f8ff; --parchment-dim:#a9c2d6;
    --line:rgba(127,212,255,0.22);
  }

  /* ---------------- منوی سریع (همبرگری: تم) ---------------- */
  .quick-menu{
    position:fixed;
    top:14px; left:14px;
    z-index:65;
  }
  .quick-menu-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(20,14,10,0.75);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .quick-menu-btn svg{ width:17px; height:17px; }
  .quick-menu-btn:hover, .quick-menu-btn.active{ border-color:var(--gold-soft); color:var(--gold); }
  .quick-menu-panel{
    position:absolute;
    top:44px; left:0;
    display:flex; flex-direction:column;
    align-items:stretch;
    gap:8px;
    min-width:168px;
    padding:12px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-8px);
    transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index:65;
  }
  .quick-menu-panel.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .quick-menu-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .quick-menu-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
  }
  .theme-switch-wrap{ position:relative; }
  .theme-toggle-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .theme-toggle-btn svg{ width:15px; height:15px; }
  .theme-toggle-btn:hover{ border-color:var(--gold-soft); color:var(--gold); }
  .theme-popover{
    position:fixed;
    width:max-content;
    max-width:min(260px, calc(100vw - 20px));
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:row; flex-wrap:wrap;
    gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transform:translateY(-6px);
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .theme-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .theme-opt{
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 9px; border-radius:9px; cursor:pointer; text-align:center;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .theme-opt.active{ color:var(--void); background:var(--gold); }
  .theme-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .lang-switch-wrap{ position:relative; }
  .lang-toggle{
    display:flex; align-items:center; gap:6px;
    font-family:'Vazirmatn', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .lang-toggle:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .lang-toggle .lang-flag{ font-size:14px; line-height:1; }
  .lang-popover{
    position:fixed;
    transform:translateY(-6px);
    min-width:150px;
    background:var(--void-2, var(--void));
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    display:flex; flex-direction:column; gap:4px;
    box-shadow:0 12px 26px rgba(0,0,0,0.5);
    opacity:0; visibility:hidden;
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    z-index:70;
  }
  .lang-popover.show{ opacity:1; visibility:visible; transform:translateY(0); }
  .lang-opt{
    display:flex; align-items:center; gap:8px;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--parchment-dim);
    background:transparent; border:1px solid transparent;
    padding:8px 10px; border-radius:9px; cursor:pointer; text-align:right;
    transition:all 0.15s ease;
  }
  .lang-opt .lang-flag{ font-size:15px; line-height:1; flex:none; }
  .lang-opt.active{ color:var(--void); background:var(--gold); }
  .lang-opt:not(.active):hover{ border-color:var(--gold-soft); color:var(--parchment); }

  .sound-toggle{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .sound-toggle svg{ width:15px; height:15px; }
  .sound-toggle:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ---------------- header ---------------- */
  .page2-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:20px 0 8px;
  }
  .page2-back{
    flex:none;
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    background:linear-gradient(135deg, var(--gold-bright, var(--gold)), var(--crimson-bright));
    background-size:200% 200%;
    color:#1a0f04;
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.02em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12);
    transition:all 0.2s ease, transform 0.25s ease;
    animation:page2Pulse 2.6s ease-in-out infinite, page2Shine 5s linear infinite;
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:60;
    overflow:hidden;
  }
  .page2-back::after{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:page2Sweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes page2Sweep{
    0%{ left:-60%; }
    38%{ left:130%; }
    100%{ left:130%; }
  }
  .page2-back svg{ width:16px; height:16px; flex:none; }
  .page2-back:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 2px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(var(--crimson-rgb),0.55), 0 0 0 5px rgba(var(--crimson-rgb),0.18); }
  .page2-back:active{ transform:scale(0.94); }
  @keyframes page2Pulse{
    0%,100%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 20px rgba(var(--crimson-rgb),0.45), 0 0 0 4px rgba(var(--crimson-rgb),0.12); }
    50%{ box-shadow:0 2px 0 rgba(255,255,255,0.35) inset, 0 8px 26px rgba(var(--crimson-rgb),0.65), 0 0 0 8px rgba(var(--crimson-rgb),0.05); }
  }
  @keyframes page2Shine{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .page2-header-title{
    flex:1;
    min-width:0;
    text-align:center;
    font-size:15px;
    font-weight:700;
    color:var(--parchment);
    overflow-wrap:break-word;
  }

  /* ---------------- logo mini ---------------- */
  .mini-logo-wrap{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .mini-logo{
    width:64px; height:64px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mini-logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------------- group label ---------------- */
  .group-label{
    font-size:12px;
    color:var(--gold-soft);
    letter-spacing:0.1em;
    margin:26px 4px 14px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .group-label.group-label-lg{
    font-size:23px;
    color:var(--gold);
    letter-spacing:0.04em;
    font-weight:800;
  }

  /* ---------------- کارت گفتگوی پرسش و پاسخ ---------------- */
  .faq-card{
    position:relative;
    border-radius:22px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)), var(--void-2, var(--void));
    box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 14px 30px rgba(0,0,0,0.35);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .faq-chat-scroll{
    flex:1;
    min-height:280px;
    max-height:52vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:18px 16px 14px;
    scroll-behavior:smooth;
  }
  .faq-msg{
    max-width:84%;
    padding:11px 15px;
    border-radius:16px;
    font-size:13.3px;
    line-height:1.85;
  }
  .faq-msg.bot{
    align-self:flex-start;
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
    border:1px solid var(--line);
    border-right:2px solid var(--gold-soft);
    color:var(--parchment);
    border-bottom-left-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
    animation:faqMsgInBot 0.32s cubic-bezier(.34,1.56,.64,1) both;
  }
  .faq-msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--gold), var(--crimson-bright));
    color:#1a0f04;
    font-weight:700;
    border-bottom-right-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
    animation:faqMsgInUser 0.24s ease both;
  }
  @keyframes faqMsgInBot{
    from{ opacity:0; transform:translate(8px,10px) scale(0.94); }
    to{ opacity:1; transform:translate(0,0) scale(1); }
  }
  @keyframes faqMsgInUser{
    from{ opacity:0; transform:translate(-8px,8px) scale(0.96); }
    to{ opacity:1; transform:translate(0,0) scale(1); }
  }
  .faq-msg-link{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:rgba(255,255,255,0.03);
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    animation:faqMsgInBot 0.28s cubic-bezier(.34,1.56,.64,1) both;
    transition:background 0.15s ease, transform 0.12s ease;
  }
  .faq-msg-link:hover{ background:rgba(255,255,255,0.08); }
  .faq-msg-link:active{ transform:scale(0.95); }
  .faq-msg-link svg{ width:12px; height:12px; flex:none; }
  .faq-typing{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:5px;
    padding:13px 16px;
    border-radius:16px;
    border-bottom-left-radius:5px;
    background:rgba(255,255,255,0.045);
    border:1px solid var(--line);
    animation:faqMsgInBot 0.24s ease both;
  }
  .faq-typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold-soft);
    animation:faqTypingBounce 1.1s ease-in-out infinite;
    box-shadow:0 0 6px rgba(212,175,55,0.5);
  }
  .faq-typing span:nth-child(2){ animation-delay:0.15s; }
  .faq-typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes faqTypingBounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }
  .faq-replies-wrap{
    flex:none;
    border-top:1px solid var(--line);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background:rgba(0,0,0,0.12);
  }
  .faq-replies-label{
    font-size:10.5px;
    color:var(--parchment-dim);
    margin-bottom:10px;
    letter-spacing:0.03em;
  }
  .faq-quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .faq-chip{
    display:flex; align-items:center; gap:6px;
    padding:10px 15px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:rgba(255,203,61,0.07);
    color:var(--gold);
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    text-align:right;
    transition:all 0.16s ease;
  }
  .faq-chip:hover{ background:rgba(255,203,61,0.15); border-color:var(--gold); }
  .faq-chip:active{ transform:scale(0.96); }
  .faq-chip.faq-chip-back{
    border-color:var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--parchment-dim);
  }
  .faq-chip.faq-chip-back:hover{ color:var(--parchment); border-color:var(--parchment-dim); }

  /* ============================================================
     ادعیه (زیارت عاشورا و ...)
  ============================================================ */
  .doa-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .doa-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), var(--void);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 24px rgba(0,0,0,0.28);
    color:var(--parchment);
    font-family:inherit;
    cursor:pointer;
    text-align:right;
    transition:border-color 0.2s ease;
  }
  html[dir="ltr"] .doa-item{ text-align:left; }
  .doa-item:hover{ border-color:var(--gold-soft); }
  .doa-item-icon{
    width:36px; height:36px; min-width:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(var(--crimson-rgb),0.16);
    color:var(--gold);
    animation:iconGlow 3.2s ease-in-out infinite;
  }
  .doa-item-icon svg{ width:18px; height:18px; }
  @keyframes iconGlow{
    0%,100%{ box-shadow:0 0 5px 0 rgba(255,203,61,0.18); }
    50%{ box-shadow:0 0 13px 3px rgba(255,203,61,0.5); }
  }
  .doa-item-name{
    flex:1;
    font-size:14.5px;
    font-weight:700;
  }
  .doa-item-chevron{
    width:18px; height:18px;
    color:var(--gold-soft);
    transition:transform 0.25s ease;
    flex-shrink:0;
  }
  .doa-item.open .doa-item-chevron{ transform:rotate(180deg); }

  .doa-sub-panel{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
    margin-top:0;
  }
  .doa-sub-panel.open{
    grid-template-rows:1fr;
    opacity:1;
    margin-top:2px;
  }
  .doa-sub-panel-inner{
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:2px 4px 4px;
  }
  .doa-sub-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 16px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    color:var(--parchment-dim);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-align:right;
    transition:all 0.18s ease;
  }
  html[dir="ltr"] .doa-sub-btn{ text-align:left; }
  .doa-sub-btn:hover{ border-color:var(--gold-soft); color:var(--parchment); }
  .doa-sub-btn svg{ width:15px; height:15px; color:var(--gold-soft); flex-shrink:0; }
  .doa-sub-btn:hover svg{ color:var(--gold); }

  /* ---------------- مودال متن دعا ---------------- */
  .doa-modal-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(3,1,1,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity 0.25s ease, visibility 0.25s ease;
  }
  .doa-modal-overlay.show{ opacity:1; visibility:visible; }
  .doa-modal-sheet{
    position:relative;
    width:100%; max-width:500px;
    height:86vh;
    display:flex;
    flex-direction:column;
    background:var(--void);
    border:1px solid var(--gold-soft);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.5);
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(0.22,1,0.36,1);
  }
  .doa-modal-overlay.show .doa-modal-sheet{ transform:translateY(0); }
  .doa-modal-handle{
    width:38px; height:4px; border-radius:999px;
    background:var(--line);
    margin:12px auto 4px;
    flex-shrink:0;
  }
  .doa-modal-head{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:10px 50px 14px;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .doa-modal-title{
    font-size:15.5px; font-weight:800; color:var(--parchment);
  }
  .doa-modal-close{
    position:absolute; top:6px; left:16px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--parchment-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  html[dir="ltr"] .doa-modal-close{ left:auto; right:16px; }
  .doa-modal-close svg{ width:14px; height:14px; }
  .doa-modal-close:hover{ border-color:var(--gold-soft); color:var(--gold); }

  /* ============================================================
     دکمه شناور دانلود فایل‌های صوتی (زیارت عاشورا، مداحی و ...)
  ============================================================ */
  .downloads-fab{
    position:fixed;
    left:16px;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    z-index:56;
    display:flex; align-items:center; gap:9px;
    padding:12px 20px 12px 16px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:linear-gradient(135deg, var(--gold), var(--gold-dim));
    color:var(--void);
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,203,61,0.5);
    animation:downloads-fab-pulse 2.6s ease-in-out infinite;
    transition:transform 0.18s ease, opacity 0.25s ease, visibility 0.25s ease;
    white-space:nowrap;
  }
  .downloads-fab:active{ transform:scale(0.95); }
  .downloads-fab.collapsed{
    opacity:0; visibility:hidden;
    transform:scale(0.8);
    pointer-events:none;
  }
  .downloads-fab svg{ width:19px; height:19px; flex:none; }
  .downloads-fab-label{
    font-family:'Vazirmatn', sans-serif;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:-0.2px;
  }
  @keyframes downloads-fab-pulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 0 rgba(255,203,61,0.45); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,0.45), 0 0 0 9px rgba(255,203,61,0); }
  }

  .downloads-list{
    display:flex; flex-direction:column; gap:10px;
    text-align:right;
  }
  .download-item{
    display:flex; flex-direction:column; gap:8px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--glass);
  }
  .download-item-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .download-progress{
    height:3px; border-radius:2px; overflow:hidden;
    background:rgba(255,255,255,0.1);
    display:none;
  }
  .download-item.loading .download-progress{ display:block; }
  .download-progress-fill{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--gold), var(--crimson-bright));
    transition:width 0.2s ease;
  }
  .download-item-title{ font-size:13px; font-weight:700; color:var(--parchment); }
  .download-item-sub{ font-size:10.5px; color:var(--parchment-dim); margin-top:2px; }
  .download-btn{
    flex:none;
    display:flex; align-items:center; gap:6px;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid var(--gold-soft);
    background:rgba(255,203,61,0.08);
    color:var(--gold);
    font-family:'Vazirmatn', sans-serif;
    font-size:11px; font-weight:700;
    cursor:pointer;
    transition:all 0.18s ease;
    white-space:nowrap;
  }
  .download-btn:hover{ background:rgba(255,203,61,0.16); }
  .download-btn .dl-icon{ width:14px; height:14px; }
  .download-btn.loading .dl-icon{ animation:dl-spin 0.9s linear infinite; }
  @keyframes dl-spin{ to{ transform:rotate(360deg); } }
  .download-btn.done{ border-color:var(--crimson-bright); color:var(--crimson-bright); background:rgba(34,193,127,0.12); }
  .download-btn.loading{ border-color:rgba(255,90,90,0.55); color:#ff8a8a; cursor:pointer; }
  .download-btn.loading:hover{ background:rgba(255,90,90,0.14); }
  .download-btn .dl-icon-cancel{ display:none; }
  .download-btn.loading .dl-icon{ display:none; }
  .download-btn.loading .dl-icon-cancel{ display:block; animation:none; }

  .doa-modal-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:22px 22px 40px;
  }
  .doa-text-arabic{
    font-family:'Amiri', serif;
    font-size:21px;
    line-height:2.5;
    text-align:center;
    color:var(--parchment);
    direction:rtl;
  }
  .doa-text-fa{
    font-family:'Vazirmatn', sans-serif;
    font-size:14.5px;
    line-height:2.3;
    text-align:justify;
    color:var(--parchment);
    direction:rtl;
  }
  .doa-text-placeholder{
    text-align:center;
    color:var(--parchment-dim);
    font-size:13px;
    padding:30px 10px;
    line-height:2;
  }
  .doa-text-arabic p{ margin:0 0 18px; }
  .doa-text-arabic p:last-child{ margin-bottom:0; }
  .doa-text-arabic p.doa-text-note{
    font-family:'Vazirmatn', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--gold);
    line-height:1.8;
    margin:6px 0 4px;
  }
  .doa-text-fa p{ margin:0 0 16px; }
  .doa-text-fa p:last-child{ margin-bottom:0; }
  .doa-text-fa p.doa-text-note{
    font-weight:700;
    color:var(--gold);
    text-align:center;
    margin:4px 0;
  }
  .doa-text-fa p.doa-text-source{
    font-size:12px;
    color:var(--parchment-dim);
    text-align:center;
    margin-top:8px;
  }

  /* ---------------- پخش صوت زیارت ---------------- */
  .doa-audio-wrap{
    padding:26px 22px 10px;
    text-align:center;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .doa-audio-status{
    font-size:11.5px;
    color:var(--parchment-dim);
    text-align:center;
    min-height:16px;
    margin-top:4px;
  }
  .doa-audio-hint{
    font-size:12.5px;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:16px;
  }
  .doa-audio-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .doa-audio-btn{
    width:56px; height:56px; min-width:56px;
    border-radius:50%;
    border:1px solid var(--gold-soft);
    background:linear-gradient(180deg, rgba(var(--crimson-rgb),0.35), rgba(var(--crimson-rgb),0.12));
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .doa-audio-btn:hover{ border-color:var(--gold); }
  .doa-audio-btn:active{ transform:scale(0.92); }
  .doa-audio-btn svg{ width:22px; height:22px; }
  .doa-audio-btn .icon-pause{ display:none; }
  .doa-audio-btn.playing .icon-play{ display:none; }
  .doa-audio-btn.playing .icon-pause{ display:flex; }
  .doa-audio-seek-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    max-width:340px;
    margin-left:auto; margin-right:auto;
  }
  .doa-audio-time{
    font-size:11px; color:var(--parchment-dim);
    min-width:34px;
    font-variant-numeric:tabular-nums;
  }
  .doa-audio-seek{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:999px;
    background:linear-gradient(to left, var(--gold) var(--pct,0%), var(--line) var(--pct,0%));
    outline:none;
    transition:box-shadow 0.25s ease;
  }
  .doa-audio-seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.2);
    cursor:pointer;
    transition:box-shadow 0.25s ease, transform 0.15s ease;
  }
  .doa-audio-seek::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%;
    background:var(--gold); border:none;
    box-shadow:0 0 0 3px rgba(201,162,39,0.2);
    cursor:pointer;
    transition:box-shadow 0.25s ease, transform 0.15s ease;
  }
  .doa-audio-wrap.playing .doa-audio-seek::-webkit-slider-thumb{
    box-shadow:0 0 0 3px rgba(201,162,39,0.28), 0 0 10px 2px rgba(201,162,39,0.55);
    transform:scale(1.12);
  }
  .doa-audio-wrap.playing .doa-audio-seek::-moz-range-thumb{
    box-shadow:0 0 0 3px rgba(201,162,39,0.28), 0 0 10px 2px rgba(201,162,39,0.55);
    transform:scale(1.12);
  }

  /* ---------------- افکت پخش صوت (هاله + اکولایزر) ---------------- */
  .doa-audio-btn{ position:relative; }
  .doa-audio-btn::before,
  .doa-audio-btn::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0;
    pointer-events:none;
  }
  .doa-audio-btn.playing::before,
  .doa-audio-btn.playing::after{
    animation:doa-audio-pulse 1.8s ease-out infinite;
  }
  .doa-audio-btn.playing::after{ animation-delay:0.6s; }
  @keyframes doa-audio-pulse{
    0%{ transform:scale(1); opacity:0.55; }
    100%{ transform:scale(1.55); opacity:0; }
  }
  .doa-audio-btn.playing{
    box-shadow:0 0 16px 2px rgba(var(--crimson-rgb),0.45);
  }
  .doa-audio-eq{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:3px;
    height:16px;
    margin-inline-start:2px;
  }
  .doa-audio-wrap.playing .doa-audio-eq{ display:flex; }
  .doa-audio-eq span{
    display:block;
    width:3px;
    border-radius:2px;
    background:var(--gold);
    animation:doa-audio-eq-bounce 0.9s ease-in-out infinite;
  }
  .doa-audio-eq span:nth-child(1){ animation-delay:0s; }
  .doa-audio-eq span:nth-child(2){ animation-delay:0.2s; }
  .doa-audio-eq span:nth-child(3){ animation-delay:0.4s; }
  .doa-audio-eq span:nth-child(4){ animation-delay:0.15s; }
  @keyframes doa-audio-eq-bounce{
    0%, 100%{ height:4px; }
    50%{ height:16px; }
  }

  /* ---------------- toast ---------------- */
  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(20,14,10,0.95);
    color:var(--parchment);
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:200;
    box-shadow:0 10px 24px rgba(0,0,0,0.4);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .guide-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:max-content;
    margin:30px auto 0;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.03);
    color:var(--gold-soft);
    font-family:'Vazirmatn', sans-serif;
    font-size:12px;
    font-weight:700;
    text-decoration:none;
    transition:all 0.18s ease;
  }
  .guide-link:hover{ border-color:var(--gold-soft); color:var(--gold); background:rgba(255,255,255,0.06); }
  .guide-link svg{ width:14px; height:14px; flex:none; }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:11.5px;
    color:var(--gold-dim);
  }
</style>
</head>

<script>
  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, successMsg){
    try{
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast(successMsg); }catch(e2){}
      document.body.removeChild(ta);
    }
  }

  (function faqChat(){
    const scrollEl = document.getElementById('faq-chat-scroll');
    const repliesEl = document.getElementById('faq-quick-replies');
    const labelEl = document.getElementById('faq-replies-label');
    if(!scrollEl || !repliesEl) return;

    const FAQ_DATA = [
      { id:'time', icon:'⏰', label:'زمان و مکان مراسم', questions:[
        { q:'مراسم هیئت چه زمانی و کجا برگزار می‌شه؟', a:'مراسم هفتگی هیئت کاظمیون هر سه‌شنبه ساعت ۲۱ در مسجد حضرت قائم (عج)، محله قاضی‌آباد خرم‌آباد برگزار می‌شه. برای دیدن شمارش معکوس تا مراسم بعدی و مسیریابی روی نقشه، کافیه سری به صفحه اول سایت بزنی.', url:'index.html', linkLabel:'مشاهده شمارش معکوس و نقشه' },
        { q:'در ایام محرم و صفر، برنامه و ساعت مراسم فرق می‌کنه؟', a:'بله؛ در ایام خاصی مثل محرم و صفر معمولاً برنامه و ساعت برگزاری تغییر می‌کنه و ممکنه مراسم اضافه‌ای هم برگزار بشه. برای اطلاع دقیق و به‌روز، اعلان‌های بالای صفحه اول سایت رو دنبال کن.', url:'index.html', linkLabel:'مشاهده اعلان‌های سایت' }
      ]},
      { id:'nazr', icon:'🕯️', label:'نذورات و کمک مالی', questions:[
        { q:'چطور می‌تونم نذر نقدی یا غیرنقدی بدم؟', a:'برای نذر نقدی، وارد صفحه «نذورات» شو؛ شماره کارت اونجا با یک ضربه قابل کپی کردنه. برای نذورات غیرنقدی مثل غذا یا لوازم، از طریق کانال‌های رسمی ایتا یا روبیکای هیئت هماهنگ کن تا محل و زمان تحویل مشخص بشه.', url:'nazr.html', linkLabel:'رفتن به بخش نذورات' },
        { q:'نذورات صرف چه کارهایی می‌شه و آیا گزارش مالی هم منتشر می‌شه؟', a:'نذورات صرف برگزاری مراسم عزاداری، پذیرایی هیئتی‌ها و هزینه‌های جاری هیئت می‌شه. برای اطلاع از وضعیت مالی و شفافیت نذورات، می‌تونی از طریق کانال رسمی هیئت درخواست گزارش بدی.' }
      ]},
      { id:'religious', icon:'📿', label:'محتوای مذهبی سایت', questions:[
        { q:'دعا، زیارت‌نامه و مداحی‌های هیئت رو از کجای سایت پیدا کنم؟', a:'در صفحه «کتابخانه» متن عربی، ترجمه فارسی و پخش صوتی زیارت عاشورا و چند دعای دیگه موجوده. مداحی‌ها و مولودی‌خوانی‌ها هم در صفحه «مداحی و مولودی» به‌صورت فهرست صوتی در دسترسن.', links:[ { url:'page2.html', label:'رفتن به کتابخانه (ادعیه و زیارت‌نامه‌ها)' }, { url:'madahi.html', label:'رفتن به مداحی و مولودی' } ] },
        { q:'صلوات‌شمار و حدیث روز چه ابزارهایی هستن؟', a:'صلوات‌شمار ابزاری برای شمارش آنلاین صلوات با ذخیره‌سازی خودکار روی گوشیته و در صفحه «صلوات‌شمار» قرار داره. حدیث روز هم در صفحه اول سایت، هر بار یک حدیث از معصومین (ع) رو به‌صورت خودکار نشون می‌ده.', url:'salavat.html', linkLabel:'رفتن به صلوات‌شمار' }
      ]},
      { id:'gallery', icon:'🖼️', label:'گالری و دانلود', questions:[
        { q:'چطور عکس‌ها و فایل‌های صوتی مراسم رو ببینم و دانلود کنم؟', a:'در صفحه «گالری تصاویر»، آرشیو عکس‌های مراسم‌های مختلف دسته‌بندی شده؛ روی عکس بزن و از دکمه دانلود گوشه لایت‌باکس استفاده کن. برای فایل‌های صوتی هم دکمه شناور «دانلود» پایین صفحه در دسترسه.', url:'gallery.html', linkLabel:'رفتن به گالری تصاویر' }
      ]},
      { id:'settings', icon:'⚙️', label:'امکانات و تنظیمات سایت', questions:[
        { q:'چطور زبان و تم رنگی سایت رو عوض کنم یا اون رو مثل اپ نصب کنم؟', a:'از منوی سریع بالای صفحه (آیکون همبرگری)، بخش «زبان» رو باز کن و فارسی، عربی یا انگلیسی رو انتخاب کن؛ از بخش «تم» هم می‌تونی پالت رنگی سایت رو عوض کنی. برای نصب سایت مثل اپلیکیشن، گزینه «نصب اپ» رو بزن (در مرورگرهایی که این قابلیت رو پشتیبانی می‌کنن).' },
        { q:'چطور سایت رو با دوستام به اشتراک بذارم؟', a:'از دکمه اشتراک‌گذاری در صفحه اول، می‌تونی لینک سایت رو در ایتا، روبیکا، سروش، بله یا تلگرام بفرستی.' }
      ]},
      { id:'contact', icon:'📞', label:'ارتباط با هیئت', questions:[
        { q:'چطور با مسئولان هیئت در ارتباط باشم یا داوطلب همکاری بشم؟', a:'از طریق کانال‌های رسمی ایتا یا روبیکا که در صفحه اول معرفی شدن، می‌تونی پیام بدی. برای همکاری هم در پیام خصوصی همون کانال‌ها اعلام آمادگی کن؛ به‌محض آماده شدن فرم ثبت‌نام خادمین، از همون کانال‌ها اطلاع‌رسانی می‌شه.', url:'index.html', linkLabel:'مشاهده کانال‌های ارتباطی' }
      ]}
    ];

    let state = { view:'categories', categoryId:null };

    function scrollToBottom(){
      requestAnimationFrame(() => { scrollEl.scrollTop = scrollEl.scrollHeight; });
    }

    function addMessage(text, who){
      const el = document.createElement('div');
      el.className = 'faq-msg ' + who;
      el.textContent = text;
      scrollEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function prefetchPage(href){
      const linkId = 'faq-prefetch-' + href.replace(/[^a-zA-Z0-9]/g, '');
      if(document.getElementById(linkId)) return;
      const link = document.createElement('link');
      link.id = linkId;
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);
    }

    function addLinkButton(url, label){
      const a = document.createElement('a');
      a.className = 'faq-msg-link';
      a.href = url;
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span>' + label + '</span>';
      a.addEventListener('pointerenter', () => prefetchPage(url), { once:true });
      a.addEventListener('touchstart', () => prefetchPage(url), { once:true, passive:true });
      a.addEventListener('click', function(e){
        if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        prefetchPage(url);
        document.body.classList.add('page-exit');
        setTimeout(() => { window.location.href = url; }, 240);
      });
      scrollEl.appendChild(a);
      scrollToBottom();
      prefetchPage(url);
    }

    function addTypingThenMessage(text, onDone){
      const typing = document.createElement('div');
      typing.className = 'faq-typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      scrollEl.appendChild(typing);
      scrollToBottom();
      setTimeout(() => {
        typing.remove();
        addMessage(text, 'bot');
        if(typeof onDone === 'function') onDone();
      }, 550 + Math.random() * 350);
    }

    function clearReplies(){ repliesEl.innerHTML = ''; }

    function addChip(text, onClick, isBack){
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'faq-chip' + (isBack ? ' faq-chip-back' : '');
      chip.textContent = text;
      chip.addEventListener('click', onClick);
      repliesEl.appendChild(chip);
    }

    function renderCategories(){
      state = { view:'categories', categoryId:null };
      labelEl.textContent = 'یکی از دسته‌ها رو انتخاب کن:';
      clearReplies();
      FAQ_DATA.forEach(cat => {
        addChip(cat.icon + ' ' + cat.label, () => selectCategory(cat.id));
      });
    }

    function selectCategory(catId){
      const cat = FAQ_DATA.find(c => c.id === catId);
      if(!cat) return;
      addMessage(cat.icon + ' ' + cat.label, 'user');
      addTypingThenMessage('بفرما، کدوم سوال برات مهمه؟ 🙂');
      state = { view:'questions', categoryId:catId };
      renderQuestionChips(cat);
    }

    function renderQuestionChips(cat){
      labelEl.textContent = 'یکی از سوال‌های زیر رو انتخاب کن:';
      clearReplies();
      cat.questions.forEach(item => {
        addChip(item.q, () => askQuestion(cat, item));
      });
      addChip('🔙 بازگشت به دسته‌ها', renderCategories, true);
    }

    function renderRelated(cat, currentItem){
      const others = cat.questions.filter(q => q !== currentItem);
      clearReplies();
      if(others.length){
        labelEl.textContent = 'سوال‌های مرتبط دیگه:';
        others.forEach(item => addChip(item.q, () => askQuestion(cat, item)));
      } else {
        labelEl.textContent = 'سوال دیگه‌ای داری؟';
      }
      addChip('🔙 بازگشت به دسته‌ها', renderCategories, true);
      state = { view:'questions', categoryId:cat.id };
    }

    function askQuestion(cat, item){
      addMessage(item.q, 'user');
      addTypingThenMessage(item.a, () => {
        if(Array.isArray(item.links)){
          item.links.forEach(l => addLinkButton(l.url, l.label || 'مشاهده در صفحه اصلی'));
        } else if(item.url){
          addLinkButton(item.url, item.linkLabel || 'مشاهده در صفحه اصلی');
        }
        renderRelated(cat, item);
      });
    }

    // پیام خوش‌آمد اولیه
    addMessage('سلام! 👋 من دستیار سایت هیئت کاظمیونم. یکی از دسته‌های زیر رو انتخاب کن تا سوال‌های مرتبط رو ببینی.', 'bot');
    renderCategories();
  })();

  // ---------------- تغییر و همگام‌سازی تم با صفحه اول ----------------
  (function themeSwitcher(){
    const toggle = document.getElementById('theme-toggle');
    const popover = document.getElementById('theme-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.theme-opt');

    document.body.appendChild(popover);

    const THEME_CLASSES = ['theme-light', 'theme-dark', 'theme-fest', 'theme-crimson', 'theme-lilac', 'theme-sunset', 'theme-amber', 'theme-sky'];
    function applyTheme(theme){
      document.body.classList.remove(...THEME_CLASSES);
      if(THEME_CLASSES.includes('theme-' + theme)) document.body.classList.add('theme-' + theme);
      opts.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      try{ localStorage.setItem('kazemiuon-theme', theme); }catch(e){}
    }

    let saved = 'default';
    try{ saved = localStorage.getItem('kazemiuon-theme') || 'default'; }catch(e){}
    applyTheme(saved);

    function positionThemePopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 132;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const top = rect.top - popover.offsetHeight - 8;
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionThemePopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionThemePopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        applyTheme(b.dataset.theme);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- باز/بسته شدن منوی همبرگری ----------------
  (function quickMenu(){
    const btn = document.getElementById('quick-menu-btn');
    const panel = document.getElementById('quick-menu-panel');
    if(!btn || !panel) return;

    function closePanel(){
      panel.classList.remove('show');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const themePop = document.getElementById('theme-popover');
      const langPop = document.getElementById('lang-popover');
      if(themePop) themePop.classList.remove('show');
      if(langPop) langPop.classList.remove('show');
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      btn.classList.toggle('active', show);
      btn.setAttribute('aria-expanded', String(show));
    });

    document.addEventListener('click', (e) => {
      if(!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
        closePanel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closePanel();
    });
  })();

  let currentLang = 'fa';

  function setLang(lang){
    if(!translations[lang]) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(translations[lang][key] !== undefined){
        el.textContent = translations[lang][key];
      }
    });
    const activeOpt = document.querySelector('.lang-opt[data-lang="' + lang + '"]');
    document.querySelectorAll('.lang-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if(activeOpt){
      const flagEl = document.getElementById('lang-toggle-flag');
      const codeEl = document.getElementById('lang-toggle-code');
      if(flagEl) flagEl.textContent = activeOpt.dataset.flag;
      if(codeEl) codeEl.textContent = activeOpt.dataset.code;
    }
  }

  // ---------------- تغییر زبان ----------------
  (function langSwitcher(){
    const toggle = document.getElementById('lang-toggle');
    const popover = document.getElementById('lang-popover');
    if(!toggle || !popover) return;
    const opts = popover.querySelectorAll('.lang-opt');

    document.body.appendChild(popover);

    function positionLangPopover(){
      const margin = 10;
      const rect = toggle.getBoundingClientRect();
      const pw = popover.offsetWidth || 150;
      let left = rect.left + rect.width / 2 - pw / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
      const ph = popover.offsetHeight || 140;
      let top = rect.bottom + 8;
      if(top + ph > window.innerHeight - margin){
        top = rect.top - ph - 8;
      }
      popover.style.left = left + 'px';
      popover.style.top = Math.max(margin, top) + 'px';
    }

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const show = !popover.classList.contains('show');
      if(show){
        popover.style.visibility = 'hidden';
        popover.classList.add('show');
        positionLangPopover();
        popover.style.visibility = '';
      }else{
        popover.classList.remove('show');
      }
      toggle.setAttribute('aria-expanded', String(show));
    });
    window.addEventListener('resize', () => {
      if(popover.classList.contains('show')) positionLangPopover();
    }, { passive:true });
    opts.forEach(b => {
      b.addEventListener('click', () => {
        setLang(b.dataset.lang);
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('click', (e) => {
      if(!popover.contains(e.target) && e.target !== toggle){
        popover.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ---------------- دکمه صدا (افکت تیک کلیک) ----------------
  (function soundToggle(){
    const soundState = { muted: true, ctx: null };
    function ensureAudioCtx(){
      if(!soundState.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) soundState.ctx = new AC();
      }
      return soundState.ctx;
    }
    function playTick(){
      if(soundState.muted) return;
      const ctx = ensureAudioCtx();
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime;
      osc.frequency.setValueAtTime(720, t0);
      osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.09);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.16);
    }
    document.querySelectorAll('.lang-opt, .lang-toggle, .theme-opt, .copy-btn').forEach(el => {
      el.addEventListener('click', playTick);
    });
    const btn = document.getElementById('sound-toggle');
    if(!btn) return;
    btn.addEventListener('click', () => {
      soundState.muted = !soundState.muted;
      btn.setAttribute('aria-pressed', String(!soundState.muted));
      btn.querySelector('.icon-sound-on').style.display = soundState.muted ? 'none' : 'block';
      btn.querySelector('.icon-sound-off').style.display = soundState.muted ? 'block' : 'none';
      if(!soundState.muted){ ensureAudioCtx(); playTick(); }
    });
  })();

  // ---------------- انتقال نرم به صفحه اول (پیش‌بارگذاری + بدون پرش) ----------------
  (function backSmoothNav(){
    const trigger = document.getElementById('page2-back');
    if(!trigger) return;
    const targetHref = trigger.getAttribute('href');

    function prefetchTarget(){
      if(document.getElementById('page2-prefetch-link')) return;
      const link = document.createElement('link');
      link.id = 'page2-prefetch-link';
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = targetHref;
      document.head.appendChild(link);
    }

    // وقتی کاربر با اسکرول به دکمه بازگشت نزدیک می‌شود، صفحه اول از قبل بارگذاری شود
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            prefetchTarget();
            io.disconnect();
          }
        });
      }, { root:null, rootMargin:'500px 0px', threshold:0 });
      io.observe(trigger);
    } else {
      prefetchTarget();
    }

    trigger.addEventListener('pointerenter', prefetchTarget, { once:true });
    trigger.addEventListener('touchstart', prefetchTarget, { once:true, passive:true });
    trigger.addEventListener('focus', prefetchTarget, { once:true });

    trigger.addEventListener('click', function(e){
      if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      prefetchTarget();
      document.body.classList.add('page-exit');
      setTimeout(() => { window.location.href = targetHref; }, 240);
    });
  })();

  // ذرات ریز طلایی پس‌زمینه (امبر)
  (function embers(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    var wrap = document.getElementById('embers');
    if(!wrap) return;
    var count = 8;
    for(var i=0;i<count;i++){
      var s = document.createElement('div');
      s.className = 'ember-spark';
      var left = Math.random()*100;
      var delay = Math.random()*10;
      var dur = 6 + Math.random()*6;
      var drift = (Math.random()*60 - 30) + 'px';
      s.style.left = left + 'vw';
      s.style.animationDelay = delay + 's';
      s.style.animationDuration = dur + 's';
      s.style.setProperty('--drift', drift);
      wrap.appendChild(s);
    }
  })();
</script>


<script>
  // ---------------- ثبت Service Worker و نصب PWA ----------------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
  (function pwaInstall(){
    let deferredPrompt = null;
    const row = document.getElementById('pwa-install-row');
    const btn = document.getElementById('pwa-install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if(row) row.style.display = '';
    });
    if(btn){
      btn.addEventListener('click', async () => {
        if(!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(row) row.style.display = 'none';
      });
    }
    window.addEventListener('appinstalled', () => {
      if(row) row.style.display = 'none';
    });
  })();
</script>
