<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1d1a">
<title>آفلاین · هیئت کاظمیون خرم‌آباد</title>
<style>
html,body{margin:0;height:100%;background:#0b1d1a;color:#f3ead2;font-family:system-ui,'Vazirmatn',Tahoma,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.c{max-width:340px}
.i{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:32px}
h1{font-size:20px;margin:0 0 10px;color:#d4af37}
p{margin:0 0 6px;line-height:1.9;font-size:14.5px;opacity:.9}
button{margin-top:18px;background:#d4af37;color:#0b1d1a;border:0;border-radius:999px;padding:11px 28px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="c">
<div class="i">☾</div>
<h1 data-k="t">اتصال اینترنت برقرار نیست</h1>
<p data-k="a">این صفحه هنوز روی گوشی ذخیره نشده است.</p>
<p data-k="b">با برگشتن اینترنت، به‌صورت خودکار باز می‌شود.</p>
<button id="r" data-k="r">تلاش دوباره</button>
</div>
<script>
(function(){
var D={fa:{t:'اتصال اینترنت برقرار نیست',a:'این صفحه هنوز روی گوشی ذخیره نشده است.',b:'با برگشتن اینترنت، به‌صورت خودکار باز می‌شود.',r:'تلاش دوباره'},
ar:{t:'لا يوجد اتصال بالإنترنت',a:'لم تُحفظ هذه الصفحة على هاتفك بعد.',b:'ستُفتح تلقائياً عند عودة الاتصال.',r:'إعادة المحاولة'},
en:{t:'You are offline',a:'This page hasn’t been saved on your device yet.',b:'It will open automatically when you are back online.',r:'Try again'}};
var l='fa';try{l=localStorage.getItem('kazemiuon-lang')||'fa';}catch(e){}
if(!D[l])l='fa';
var h=document.documentElement;h.lang=l;h.dir=l==='en'?'ltr':'rtl';
[].forEach.call(document.querySelectorAll('[data-k]'),function(e){e.textContent=D[l][e.getAttribute('data-k')];});
document.title=D[l].t;
function go(){location.reload();}
document.getElementById('r').onclick=go;
window.addEventListener('online',go);
})();
</script>
</body>
</html>
